[package]
name = "rotmg-loot-roadmap"
version = "1.0.3"
description = "RotMG loot roadmap, kit planner and enchant browser."
authors = ["TerraByte"]
edition = "2021"
rust-version = "1.77.2"
publish = false

# One binary, one platform. No lib target: this app never builds for mobile,
# so the lib.rs/main.rs split the default scaffold uses buys nothing here.
[[bin]]
name = "rotmg-loot-roadmap"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pinned to 0.61 on purpose: tauri 2.11.5 resolves `windows` to 0.61.3, and
# `WebviewWindow::hwnd()` hands back *that* crate's `HWND`. A different major here
# would compile into a second, incompatible HWND type.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
