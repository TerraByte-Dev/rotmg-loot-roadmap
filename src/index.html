<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RotMG Loot Roadmap</title>
<style>
/* ============================================================================
   THEME TOKENS — this block is the entire skin. Nothing below hardcodes a colour.
   ========================================================================= */
:root{
  /* Every theme here is dark. Saying so lets the platform draw its own widgets - select
     popups, the search field's clear button, text carets, and the fallback scrollbar -
     in dark rather than the bright default. */
  color-scheme: dark;
  --bg:#0a0c0f; --bg-panel:#0f1318; --bg-hover:#19212a;
  --line:#212b35; --line-soft:#171f27;
  --ink:#c9d4de; --ink-dim:#7c8b99; --ink-faint:#4d5b68;
  --accent:#4ee39a; --accent-dim:#1f6b48; --accent-glow:rgba(78,227,154,.13);

  /* item types — coloured the way the game colours them */
  --ut:#b46ce8;    --ut-bg:rgba(180,108,232,.14);   /* UT reads purple in game */
  --st:#ffab4a;    --st-bg:rgba(255,171,74,.14);
  --td:#8794a1;    --td-bg:rgba(135,148,161,.10);
  --shiny:#5fd8ff; --shiny-bg:rgba(95,216,255,.14);

  --warn:#ffb347; --warn-bg:rgba(255,179,71,.10);
  --good:#4ee39a;

  --font: ui-monospace,"Cascadia Mono","JetBrains Mono","SF Mono",Consolas,monospace;
  --fs:13.5px; --radius:3px;
  --atlas:url("__SPRITE_ATLAS__");
  --ico:32px;                       /* 16px art; use multiples of 16 to stay crisp */
}
/* ---- the pixel headline font -------------------------------------------------
   Silkscreen, by the Silkscreen Project Authors, SIL Open Font License 1.1 - the
   licence travels with it at assets/fonts/OFL.txt. It is NOT the game's font: RotMG
   uses Adobe's Myriad Pro, which is not redistributable, and the extracted client
   assets contain no font file and no glyph sheet at all. This is the closest thing
   that can legally ship.

   It is a HEADLINE font on purpose. A pixel face at 11px with tabular numbers in it
   is unreadable, so the tables, the stat chips and every number stay monospace and
   only the chrome - brand, nav, section headers, tabs - takes it. */
@font-face{font-family:"Silkscreen";font-style:normal;font-weight:400;font-display:swap;
  src:url("__FONT_PIXEL_400__") format("woff2")}
@font-face{font-family:"Silkscreen";font-style:normal;font-weight:700;font-display:swap;
  src:url("__FONT_PIXEL_700__") format("woff2")}
/* Off by default; Settings sets data-pixel on <html>. Everything that should take the
   font points at --font-display, so the switch is one token. */
:root{--font-display:var(--font)}
html[data-pixel="1"]{--font-display:"Silkscreen",var(--font)}
html[data-pixel="1"] .brandbtn .btxt b,
html[data-pixel="1"] .navbtn,
html[data-pixel="1"] .dsec,
html[data-pixel="1"] .railhead,
html[data-pixel="1"] .slottab .lbl,
html[data-pixel="1"] .pettab,
html[data-pixel="1"] .tab,
html[data-pixel="1"] .wdg .bar .t,
html[data-pixel="1"] .home h2,
html[data-pixel="1"] .charcard b,
html[data-pixel="1"] .dghead .nm,
html[data-pixel="1"] h1,html[data-pixel="1"] h3{font-family:var(--font-display);
  letter-spacing:.02em}
/* Silkscreen has no descender room to speak of and rides high in its box. */
html[data-pixel="1"] .navbtn,html[data-pixel="1"] .pettab,html[data-pixel="1"] .tab{
  padding-top:calc(0.35em + 2px)}

/* ---- scrollbars -----------------------------------------------------------
   Drawn from the same tokens as everything else, so each theme gets its own. The
   thumb is a 5px bar floating inside an 11px gutter: the transparent border plus
   background-clip is what insets it, since a scrollbar thumb has no margin.

   Chromium ignores ::-webkit-scrollbar entirely once the standard scrollbar-width /
   scrollbar-color are set on the same element, so those are gated to engines with no
   ::-webkit-scrollbar at all - Firefox, which only ever sees the shipped single-file
   roadmap.html. WebView2 keeps the custom one. */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;min-height:28px;
  border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){
  *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
}
/* The overlay is 340px wide; a full-size gutter is a real fraction of it. */
body.widget ::-webkit-scrollbar{width:8px}
body.widget ::-webkit-scrollbar-thumb{border-width:2px}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}

.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}}

.rail{background:var(--bg-panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brandbtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink-dim);
  font:inherit;text-align:left}
.brandbtn:hover{background:var(--bg-hover)}
.brandbtn .bico .ico{--ico:34px}
.brandbtn .btxt b{display:block;color:var(--accent);font-size:13px;letter-spacing:.16em}
.brandbtn .btxt small{display:block;color:var(--ink-faint);font-size:10px;margin-top:1px}
.nav{display:flex;flex-direction:column;padding:7px 8px;gap:3px}
.navgap{flex:1;min-height:0}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;cursor:pointer;
  background:none;border:1px solid transparent;border-radius:var(--radius);
  color:var(--ink-dim);font:inherit;font-size:13px;text-align:left}
.navbtn .ico{--ico:26px}
.navbtn .n{margin-left:auto;color:var(--ink-faint);font-size:10.5px}
.navbtn:hover{background:var(--bg-hover);color:var(--ink)}
.navbtn[aria-selected=true]{background:var(--accent-glow);border-color:var(--accent-dim);color:var(--accent)}
.navbtn.pop{color:var(--accent);border-color:var(--accent-dim);justify-content:center;
  font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.navbtn.pop:hover{background:var(--accent-glow)}
.navsep{border-top:1px solid var(--line-soft);margin:6px 2px 3px}

/* ---- bestiary: the biome rail lives OUTSIDE the picture ---- */
.bestiary{display:grid;grid-template-columns:196px 1fr;flex:1;min-height:0}
.brail{border-right:1px solid var(--line);background:var(--bg-panel);overflow:auto;padding-bottom:8px}
.brail .railhead{color:var(--ink-faint);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 10px 5px}
.brow{display:flex;align-items:center;gap:3px;padding:1px 8px}
.brow .bname{flex:1;min-width:0;text-align:left;background:none;border:0;cursor:pointer;
  color:var(--ink-dim);font:inherit;font-size:11.5px;padding:3px 4px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;border-radius:var(--radius)}
.brow .bname:hover{background:var(--bg-hover);color:var(--ink)}
.brow .approx{color:var(--ink-faint);padding-left:3px}
.brow.on .bname{color:var(--good)}
.brow.off .bname{color:var(--ink-faint);text-decoration:line-through}
.bmark{width:19px;height:19px;flex:none;cursor:pointer;background:none;border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink-faint);font:inherit;font-size:10px;line-height:1;padding:0}
.bmark:hover{border-color:var(--ink-faint);color:var(--ink)}
.bmark.g[aria-pressed=true]{border-color:var(--good);color:var(--good);background:rgba(78,227,154,.14)}
.bmark.r[aria-pressed=true]{border-color:#ff6b6b;color:#ff6b6b;background:rgba(255,107,107,.14)}
/* The shade rides the same transform as the image, so it stays glued while panning. */
.bshade{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bdim,.blit{position:absolute;top:0;left:0;transform-origin:0 0}
.bdim{background:rgba(4,6,8,.68)}
.bdim.red{background:rgba(26,4,6,.88)}
.blit{box-shadow:inset 0 0 0 2px var(--good);background:rgba(78,227,154,.06)}

/* ---- stat chips: the game's own potion art + its own colours ---- */
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
.chips.tight{margin:0;gap:3px}
.chips.tight .chip{padding:0 5px 0 2px;font-size:11px}
.chips.tight .chip .ico{--ico:13px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#000;
  border:1px solid var(--line);border-radius:var(--radius);padding:1px 6px 1px 3px;
  font-size:11.5px;line-height:1.5}
.chip .ico{--ico:14px}
.chip b{font-weight:600;letter-spacing:.04em;
  text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.chip i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-dim)}
.chip i.up{color:var(--good)}
.chip i.down{color:#ff6b6b}
.chip .of{color:var(--ink-faint);font-size:10px}
/* Dashed = you only get this sometimes. Never in the Kit totals. */
.chip.cond{border-style:dashed;opacity:.9}
.chip.cond i{color:var(--ink-dim)}
.chip.scal i.x{color:var(--shiny);font-size:10px;letter-spacing:.04em}

/* ---- damage table ---- */
table.dmg{width:100%;border-collapse:collapse;margin-top:3px}
table.dmg th{color:var(--ink-faint);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:400;padding:2px 5px;text-align:right}
table.dmg td{padding:2px 5px;border-top:1px solid var(--line-soft);font-size:12.5px}
table.dmg td.k{color:var(--ink-faint);font-size:11.5px;text-align:left}
table.dmg td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
table.dmg td.num.hi{color:var(--accent)}
table.dmg td.up{color:var(--good)}
table.dmg td.down{color:#ff6b6b}

/* ---- pets ---- */
.pettabs{display:flex;gap:6px;padding:9px 13px 0}
.pettab{background:none;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;
  color:var(--ink-dim);font:inherit;font-size:12px;padding:6px 13px}
.pettab[aria-selected=true]{border-color:var(--accent-dim);background:var(--accent-glow);color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:9px;padding:11px 13px}
.pcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-panel);padding:10px 12px}
.pcard .pnm{color:var(--ink);font-size:13.5px}
.pcard .grp{color:var(--ink-faint);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.prow{display:flex;gap:8px;align-items:baseline;padding:2px 0;border-top:1px solid var(--line-soft)}
.prow .k{color:var(--ink-faint);font-size:11.5px;min-width:104px}
.prow .v{color:var(--ink);font-size:12.5px;font-variant-numeric:tabular-nums}
.prow .v .to{color:var(--ink-faint);padding:0 3px}
.prow .c{margin-left:auto;color:var(--ink-faint);font-size:10px}
.prow.sub .k{padding-left:11px;font-style:italic}
.atlv{border:1px solid var(--accent-dim);background:var(--accent-glow);border-radius:var(--radius);
  padding:6px 8px;margin-bottom:7px}
.atlv .k{color:var(--accent);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase}
.atlv .v{font-size:13px;color:var(--ink);margin:2px 0}
.atlv .v b{color:var(--accent);font-variant-numeric:tabular-nums}
.ladder{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ladder b{background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:2px 6px;font-weight:400;color:var(--ink-dim);font-size:11.5px}
.ladder b i{color:var(--ink-faint);font-style:normal;font-size:10px}

/* ---- home: pick a character ---- */
.home{padding:22px 26px;overflow:auto}
.home h2{margin:0 0 3px;font-size:15px;color:var(--ink);letter-spacing:.04em}
.home .lead{color:var(--ink-faint);font-size:12px;margin-bottom:18px}
.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.charcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:15px 8px 12px;
  cursor:pointer;background:none;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-dim);font:inherit}
.charcard .ico{--ico:64px}
.charcard b{color:var(--ink);font-size:13px;font-weight:500}
.charcard small{color:var(--ink-faint);font-size:10.5px}
.charcard:hover{border-color:var(--accent-dim);background:var(--bg-hover)}
.charcard[aria-selected=true]{border-color:var(--accent);background:var(--accent-glow)}
.charcard[aria-selected=true] b{color:var(--accent)}
.brand{padding:12px 13px 9px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand .sub{color:var(--ink-faint);font-size:10px;margin-top:2px;white-space:pre-line;line-height:1.35}
.railscroll{overflow-y:auto;min-height:0;flex:1;padding:6px 0}
.railhead{padding:9px 13px 4px;color:var(--ink-faint);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
.slottabs{display:flex;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line)}
.slottab{flex:1;display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink-dim);font:inherit;text-align:left}
.slottab .ico{--ico:38px}
.slottab .txt{min-width:0;overflow:hidden}
.slottab .lbl{display:block;font-size:13px;color:var(--ink);letter-spacing:.04em}
.slottab .sub{display:block;font-size:10.5px;color:var(--ink-faint)}
.slottab>div:last-child,.slottab .txt{min-width:0}
.slottab:hover{border-color:var(--accent-dim);color:var(--ink)}
.slottab[aria-selected=true]{border-color:var(--accent);background:var(--accent-glow)}
.slottab[aria-selected=true] .lbl{color:var(--accent)}
.slottab .n{margin-left:5px}

.classgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:4px 6px}
.cls2{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;
  background:none;border:0;border-radius:var(--radius);cursor:pointer;color:var(--ink-dim);
  font:inherit;font-size:10.5px;line-height:1.1;position:relative}
.cls2 .ico{--ico:44px}
.cls2:hover{background:var(--bg-hover);color:var(--ink)}
.cls2[aria-pressed=true]{background:var(--accent-glow);color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent-dim)}
.cls2 .wep{color:var(--ink-faint);font-size:9px;letter-spacing:.04em}
.cls{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:0;
     border-left:2px solid transparent;color:var(--ink-dim);padding:4px 13px;cursor:pointer}
.cls:hover{background:var(--bg-hover);color:var(--ink)}
.cls[aria-pressed=true]{background:var(--accent-glow);border-left-color:var(--accent);color:var(--accent)}
.cls small{color:var(--ink-faint);font-size:9.5px;margin-left:auto}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;border-bottom:1px solid var(--line);background:var(--bg-panel);flex-wrap:wrap}
.vtab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-dim);
      padding:9px 15px;cursor:pointer;letter-spacing:.05em}
.vtab:hover{color:var(--ink);background:var(--bg-hover)}
.vtab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.vtab .n{color:var(--ink-faint);font-size:9.5px;margin-left:6px}

.tabs{display:flex;border-bottom:1px solid var(--line-soft);background:var(--bg-panel);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-dim);
     padding:7px 13px;cursor:pointer}
.tab:hover{color:var(--ink);background:var(--bg-hover)}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{color:var(--ink-faint);font-size:9.5px;margin-left:6px}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 13px;
     border-bottom:1px solid var(--line-soft);background:var(--bg-panel)}
.bar input[type=search],.bar select{background:var(--bg);border:1px solid var(--line);color:var(--ink);
     padding:4px 7px;border-radius:var(--radius);outline:0}
.bar input[type=search]{min-width:170px}
.bar input:focus,.bar select:focus{border-color:var(--accent-dim)}
.bar label{color:var(--ink-dim);display:flex;gap:5px;align-items:center;cursor:pointer;font-size:11.5px}
.bar .spacer{margin-left:auto;color:var(--ink-faint);font-size:10.5px}

.body{display:flex;flex:1;min-height:0}
.scroll{overflow:auto;flex:1;min-height:0}

/* sprites sit on nothing — the art is the thing */
.ico{width:var(--ico);height:var(--ico);flex:0 0 auto;background-image:var(--atlas);
     background-repeat:no-repeat;image-rendering:pixelated}
.ico.none{background-image:none}
.icopair{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.doors{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
.door{display:inline-flex;cursor:help}
.door .ico{--ico:26px}
.doors .src{cursor:help}

table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;z-index:2;background:var(--bg-panel);text-align:left;font-weight:500;
  color:var(--ink-faint);letter-spacing:.13em;text-transform:uppercase;
  padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:10.5px}
tbody td{padding:4px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;
  overflow:hidden}   /* ellipsis lives on .nm / .dname, not here - on a sprite cell it
                        rendered a stray dash next to every shiny pair */
/* The item list is long by nature, so it is laid out FIXED. On auto layout the Item
   column absorbed every spare pixel and left a canyon between a name and its bag. */
table.items{table-layout:fixed}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg-hover)}
tbody tr[aria-selected=true]{background:var(--accent-glow)}
tbody tr.tracked{box-shadow:inset 3px 0 0 var(--st), inset 0 0 0 1px rgba(255,171,74,.20)}
tbody tr.tracked .nm{color:var(--st)}
.nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
/* door + boss + the dungeon's name, on one line, name allowed to truncate */
.dropin{display:flex;align-items:center;gap:6px;min-width:0}
.dropin .doors{flex:0 0 auto}
.dropin .dname{color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropin .more{color:var(--ink-faint);flex:0 0 auto}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-dim)}
.num.hi{color:var(--good)}
.src{color:var(--ink-dim);font-size:12.5px}
.src.raw{color:var(--ink-faint);font-style:italic}
.dim{color:var(--ink-faint)}

.tg{display:inline-block;font-size:10px;padding:0 5px;border-radius:var(--radius);letter-spacing:.06em;font-weight:600}
.tg-UT{color:var(--ut);background:var(--ut-bg)}
.tg-ST{color:var(--st);background:var(--st-bg)}
.tg-Tiered{color:var(--td);background:var(--td-bg)}
.tg-sh{color:var(--shiny);background:var(--shiny-bg)}
.tg-old{color:var(--ink-faint);border:1px solid var(--line)}
.star{background:none;border:0;color:var(--ink-faint);cursor:pointer;padding:0 2px;font-size:13px;line-height:1}
.star.on{color:var(--st)}

.detail{width:320px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--bg-panel);
        overflow:auto;padding:13px}
.detail.empty{color:var(--ink-faint);display:flex;align-items:center;justify-content:center;text-align:center}
.detail h3{margin:0 0 2px;font-size:15px;color:var(--ink)}
.dhead{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.dhead .ico{--ico:48px}
.drow{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px solid var(--line-soft)}
.drow span:first-child{color:var(--ink-faint)}
.ddesc{color:var(--ink-dim);margin:9px 0;line-height:1.5}
.dsec{color:var(--ink-faint);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin:13px 0 5px}
.note{display:block;color:var(--warn);background:var(--warn-bg);border-left:2px solid var(--warn);
      padding:4px 7px;margin-top:5px;font-size:11px;line-height:1.45}

.kit{padding:13px;overflow:auto;flex:1}
.kitslots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:6px}
.kitslot{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-panel);padding:9px;min-height:74px}
.kitslot.filled{border-color:var(--accent-dim)}
.kitslot .lbl{color:var(--ink-faint);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:5px}
.kitslot .pick{display:flex;gap:8px;align-items:center;cursor:pointer}
.kitslot .pick .ico{--ico:32px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.stat{border:1px solid var(--line-soft);border-radius:var(--radius);padding:5px 8px;background:var(--bg-panel)}
.stat .k{color:var(--ink-faint);font-size:9.5px;letter-spacing:.1em}
.stat .v{font-size:15px;color:var(--ink)}
.stat .b{color:var(--good);font-size:11px}
.stat .e{color:var(--accent);font-size:11px}
.stat .b.neg,.stat .e.neg{color:#ff6b6b}
.stat .k{display:flex;align-items:center;gap:4px}
.stat .k .sico .ico{--ico:13px}

.dungeon{display:flex;gap:9px;align-items:center;padding:4px 13px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.dungeon:hover{background:var(--bg-hover)}
.dungeon .ico{--ico:32px}
.empty{padding:34px 14px;color:var(--ink-faint);text-align:center;line-height:1.7}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:7px;padding:11px 13px}
.ecard{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-panel);padding:8px 10px}
.ehead{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.ehead .ico{--ico:24px}
.tier{display:flex;align-items:center;gap:5px;font-size:10.5px;margin-top:1px}
.tier .best{color:var(--accent);border:1px solid var(--accent-dim);border-radius:var(--radius);
  padding:0 4px;font-size:9px;letter-spacing:.08em}
.pips{display:inline-flex;gap:2px}
.pips i{width:5px;height:5px;border-radius:50%;display:block}
td .pips{display:inline-flex;gap:2px;align-items:center}
.edesc{white-space:normal;line-height:1.45}
.eexcl{margin-top:5px;color:var(--warn);font-size:10.5px;white-space:normal}
.plan{padding:10px 13px;border-bottom:1px solid var(--line)}
.dglist{padding:6px 9px}
.dgrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:none;border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:9px 12px;margin-bottom:5px;color:var(--ink-dim);font:inherit}
.dgrow:hover{border-color:var(--accent-dim);background:var(--bg-hover)}
.dgrow .art{display:inline-flex;gap:3px;flex:0 0 auto}
.dgrow .art .ico{--ico:34px}
.dgrow .txt{flex:1;min-width:0}
.dgrow .nm{display:block;color:var(--ink);font-size:13.5px}
.dgrow .dim{display:block;font-size:11px}
.dgrow .diff{flex:0 0 auto;min-width:34px;text-align:center;color:var(--st);
  background:var(--st-bg);border-radius:var(--radius);padding:2px 7px;font-size:12px}
.dgrow .diff.none{color:var(--ink-faint);background:none}
.dgrow .chev{color:var(--ink-faint);font-size:17px;flex:0 0 auto}
.dghead{display:flex;align-items:center;gap:11px;padding:11px 13px 8px;border-bottom:1px solid var(--line-soft)}
.dghead .art{display:inline-flex;gap:3px}
.dghead .art .ico{--ico:40px}
.dghead .nm{color:var(--ink);font-size:14px}
.trackhead{display:flex;gap:10px;align-items:center;padding:11px 13px 7px;
  border-top:1px solid var(--line-soft);position:sticky;top:0;background:var(--bg-panel);z-index:1}
.trackhead .ico{--ico:36px}
.trackhead.go{cursor:pointer}
.trackhead.go:hover .nm{color:var(--accent)}
.eslots{display:inline-flex;gap:4px;align-items:center}
.eslot{background:none;border:1px dashed var(--line);color:var(--ink-faint);cursor:pointer;
  width:30px;height:30px;border-radius:var(--radius);padding:0;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.eslot:hover{border-color:var(--accent-dim);color:var(--accent)}
.eslot.on{border-style:solid;border-color:var(--accent-dim)}
.eslot.lock{border-style:solid;border-color:var(--st);box-shadow:0 0 0 1px var(--st) inset}
.eslot .lk{position:absolute;right:-3px;bottom:-4px;font-size:9px;line-height:1;
  filter:drop-shadow(0 0 2px var(--bg))}
.eslot{position:relative}
.eslot .ico{--ico:24px}
.roll{background:none;border:1px solid var(--line);color:var(--ink-dim);cursor:pointer;
  border-radius:var(--radius);font:inherit;font-size:10.5px;padding:3px 9px;margin-left:5px}
.roll:hover{border-color:var(--accent-dim);color:var(--accent)}
.planrow{display:flex;gap:9px;align-items:center;padding:3px 0}
.planrow .ico{--ico:28px}
.hint{padding:6px 13px;color:var(--ink-faint);font-size:11px;border-bottom:1px solid var(--line-soft)}
.mini{background:var(--bg);border:1px solid var(--line);color:var(--ink-dim);border-radius:var(--radius);
      padding:1px 7px;margin-left:6px;cursor:pointer;font-size:11px}
.mini:hover{color:var(--accent);border-color:var(--accent-dim)}
.bwrap{flex:1;min-height:0;overflow:hidden;position:relative;cursor:grab;background:#07090b;touch-action:none}
.bwrap:active{cursor:grabbing}
.bband{position:absolute;top:0;left:0;transform-origin:0 0;pointer-events:none;
  box-shadow:inset 0 0 0 2px var(--accent), 0 0 0 9999px rgba(7,9,11,.62)}
#bimg{position:absolute;top:0;left:0;transform-origin:0 0;image-rendering:pixelated;max-width:none;
      user-select:none;-webkit-user-drag:none;pointer-events:none}
.picking{background:var(--warn-bg);color:var(--warn);padding:6px 13px;font-size:11.5px;border-bottom:1px solid var(--line-soft)}

/* ---- window chrome. Only shown in the desktop app; the page in a browser keeps the
   browser's own chrome and never sees this. ------------------------------------- */
body.tauri .app{height:calc(100vh - 34px)}
/* In the app this is chrome, not a document. Dragging across it should not paint a
   text selection over the whole UI. Inputs stay selectable. */
body.tauri{user-select:none;-webkit-user-select:none}
body.tauri input,body.tauri textarea,body.tauri .ddesc,body.tauri .edesc{user-select:text;-webkit-user-select:text}
.titlebar{display:none}
body.tauri .titlebar{display:flex;align-items:center;height:34px;background:var(--bg-panel);
  border-bottom:1px solid var(--line);user-select:none;position:relative;z-index:60}
.titlebar .tb-title{padding:0 12px;color:var(--ink-faint);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;pointer-events:none}
.titlebar .tb-drag{flex:1;align-self:stretch}
.tb-btn{width:46px;height:34px;background:none;border:0;color:var(--ink-dim);cursor:pointer;
  font:inherit;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.tb-btn:hover{background:var(--bg-hover);color:var(--ink)}
.tb-btn.close:hover{background:#c0392b;color:#fff}
.tb-btn.gear{width:38px;font-size:15px}
.tb-btn.pop{width:auto;padding:0 12px;font-size:11px;letter-spacing:.08em;gap:5px;
  color:var(--accent);text-transform:uppercase}
.tb-btn.pop:hover{background:var(--accent-glow)}
.tb-btn.gear.on{color:var(--accent)}

.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;
  align-items:flex-start;justify-content:flex-end}
.sheet .card{width:340px;max-height:100%;overflow:auto;background:var(--bg-panel);
  border-left:1px solid var(--line);padding:16px 18px}
.sheet h2{margin:0 0 3px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sheet .sub{color:var(--ink-faint);font-size:10.5px;margin-bottom:14px}
.sheet .grp{margin:16px 0 6px;color:var(--ink-faint);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
/* 15 of them now, so three across and a scroll rather than a two-wide column
   that pushes Updates and About off the sheet. */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:232px;overflow:auto}
.thm{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);
  border-radius:var(--radius);background:none;color:var(--ink-dim);cursor:pointer;font:inherit;font-size:11px}
.thm:hover{border-color:var(--accent-dim)}
.thm[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.door.set{outline:1px solid var(--st);outline-offset:-1px;border-radius:2px}
.gen{font-size:10px;letter-spacing:.04em;color:var(--ink-faint);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:0 4px;white-space:nowrap}
.gen.cur{color:var(--st);border-color:var(--st)}
.gen.legacy{color:var(--ink-faint);text-decoration:line-through}
.swatch{width:15px;height:15px;border-radius:3px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.srow{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:11.5px;color:var(--ink-dim)}
.srow input[type=range]{flex:1;accent-color:var(--accent)}
.sbtn{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:var(--radius);
  padding:5px 11px;cursor:pointer;font:inherit;font-size:11.5px}
.sbtn:hover{border-color:var(--accent-dim);color:var(--accent)}
.updmsg{font-size:11px;color:var(--ink-faint);margin-top:7px;white-space:normal;line-height:1.45}

/* ---- overlay widget: the same page, rendered small ------------------------- */
body.widget{background:var(--bg-panel);overflow:hidden}
body.widget .app,body.widget .titlebar{display:none}
.wdg{display:flex;flex-direction:column;height:100vh}
.wdg .bar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);
  background:var(--bg-panel)}
.wdg .bar .t{flex:1;color:var(--accent);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.wdg .bar button{background:none;border:0;color:var(--ink-faint);cursor:pointer;font:inherit;
  font-size:12px;padding:0 4px}
.wdg .bar button:hover{color:var(--ink)}
.wdg .list{flex:1;overflow:auto;padding:4px;--wico:44px}
/* A wall of doors. The icon size is set from JS to the largest value at which they all
   still fit - the point of the overlay is seeing every place at once, from across the
   room. The NAME is not on screen until you hover: at this size the art is the label,
   and a column of text beside it is what made the old version feel like a list. */
.wdg .dgs{display:flex;flex-wrap:wrap;gap:4px}
.wdg .dg{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:none;border:1px solid transparent;border-radius:var(--radius);padding:3px;
  color:var(--ink);font:inherit}
.wdg .dg:hover{background:var(--bg-hover);border-color:var(--line)}
.wdg .dg[aria-expanded=true]{background:var(--accent-glow);border-color:var(--accent-dim)}
.wdg .dg .ico{--ico:var(--wico)}
/* The name only exists on hover, and it floats over the neighbours rather than
   reflowing them - a grid that reshuffles under the pointer is unusable. */
.wdg .dg .nm{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:#000;border:1px solid var(--line);border-radius:var(--radius);
  padding:1px 6px;font-size:11px;color:var(--ink);opacity:0;pointer-events:none;
  transition:opacity .08s;z-index:2}
.wdg .dg:hover .nm,.wdg .dg:focus-visible .nm{opacity:1}
.wdg .dg .n{position:absolute;top:0;right:0;color:var(--accent);font-size:10px;line-height:1;
  background:#000;border:1px solid var(--accent-dim);border-radius:8px;padding:1px 4px}
.wdg .drops{margin-top:5px;border-top:1px solid var(--line);padding:5px 2px 2px}
.wdg .dtitle{color:var(--accent);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  padding:0 7px 3px}
.wdg .row{display:flex;align-items:center;gap:7px;padding:2px 9px;font-size:11.5px;color:var(--ink-dim)}
.wdg .row .ico{--ico:22px}
.wdg .row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdg .empty{padding:18px 12px;color:var(--ink-faint);font-size:11.5px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="titlebar">
  <span class="tb-title">Loot Roadmap</span>
  <div class="tb-drag" data-tauri-drag-region></div>
  <button class="tb-btn pop" id="tb-pop" type="button"
          title="Pop out a small always-on-top overlay listing what you are tracking">&#9195; Pop Out</button>
  <button class="tb-btn gear" id="tb-gear" type="button" title="Settings">&#9881;</button>
  <button class="tb-btn" id="tb-min" type="button" title="Minimise">&#8211;</button>
  <button class="tb-btn" id="tb-max" type="button" title="Maximise">&#9633;</button>
  <button class="tb-btn close" id="tb-close" type="button" title="Close">&#10005;</button>
</div>
<div class="app">
  <aside class="rail">
    <button class="brandbtn" type="button" data-home
            title="Back to the character picker">
      <span class="bico" id="brandico"></span>
      <span class="btxt"><b>RotMG</b><small id="brandsub2">pick a character</small></span>
    </button>
    <nav class="nav" id="navtop"></nav>
    <div class="navgap"></div>
    <nav class="nav" id="navbot"></nav>
  </aside>
  <main class="main">
    <div class="topbar" id="views"></div>
    <div id="panel" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
  </main>
</div>

<script id="rotmg-data" type="application/json">__ROTMG_DATA__</script>
<script id="bestiary-src" type="text/plain">__BESTIARY__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("rotmg-data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const SP = D.sprites || {};
const byId = Object.fromEntries(D.items.map(i => [i.id, i]));
const enchById = Object.fromEntries((D.enchants||[]).map(e => [e.id, e]));
// The slots that hold something that shoots. Same six the build uses to decide whether
// an item's damage number is a weapon DPS or an ability proc.
const WEAPON_SLOT_SET = new Set([1,2,3,8,17,24]);
// source name -> bestiary biome, for the "click a place, see its mobs" jump. The
// infographic is organised by realm BIOME, not by dungeon, so only realm/biome sources
// can link into it - a Lost Halls door has nowhere to go.
const BIOME_OF = D.biomeOf || {};
const BIOME_BANDS = D.biomeBands || {};
const LS  = k => { try { return JSON.parse(localStorage.getItem(k)||"null"); } catch(e){ return null; } };
const LSet= (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

const S = {
  cls: LS("rm.cls") || "Wizard",
  view:"home", tab:0, sel:null, kitPick:null, lvl1:false, biome:null, trackAt:null, dgAt:null,
  ptab: LS("rm.ptab")==="feed" ? "feed" : "ability",
  petGear: LS("rm.petGear")===true,
  enchTop: LS("rm.enchTop")!==false,   // he only cares about the best roll; default on
  petFrom: null, petTo: null,
  petSlot: ["first","second","third"].includes(LS("rm.petSlot")) ? LS("rm.petSlot") : "first",
  petLv: (typeof LS("rm.petLv")==="number" && LS("rm.petLv")>=1 && LS("rm.petLv")<=100)
         ? LS("rm.petLv") : 50,
  statf: LS("rm.statf") || "",   // "show me everything that touches ATT"
  pixel: LS("rm.pixel")===true,
  // biome name -> "g" (hunting here) or "r" (done). Kept out of S.biome, which is just
  // where the view is scrolled to.
  biomeMark: (LS("rm.biomeMark") && typeof LS("rm.biomeMark")==="object"
              && !Array.isArray(LS("rm.biomeMark"))) ? LS("rm.biomeMark") : {},
  theme: LS("rm.theme") || "roadmap",
  opacity: (typeof LS("rm.widgetOpacity")==="number") ? LS("rm.widgetOpacity") : 0.92,
  kit: (LS("rm.kit") && typeof LS("rm.kit")==="object" && !Array.isArray(LS("rm.kit")))?LS("rm.kit"):{},
  track: (Array.isArray(LS("rm.track"))?LS("rm.track"):[]).filter(x=>typeof x==="string"),
  // itemId -> [enchantId | null, ...] — what you WANT rolled on it, not what you have.
  ench: (LS("rm.ench") && typeof LS("rm.ench")==="object" && !Array.isArray(LS("rm.ench")))?LS("rm.ench"):{},
  // itemId -> [bool,...] — slots held through a reroll. The client has no lock mechanic;
  // this is the app's own affordance and the UI says so.
  lock: (LS("rm.lock") && typeof LS("rm.lock")==="object" && !Array.isArray(LS("rm.lock")))?LS("rm.lock"):{},
  enchPick: null,   // {id, slot} while choosing
};
const cls = () => D.classes.find(c => c.name === S.cls) || D.classes[0];
const SLOTLBL = ["Weapon","Ability","Armor","Ring"];

function ico(n, extra){
  if (SP.cols == null || n == null) return `<div class="ico none"></div>`;
  const c = n % SP.cols, r = Math.floor(n / SP.cols);
  return `<div class="ico" style="background-size:calc(var(--ico) * ${SP.cols}) auto;`+
         `background-position:calc(var(--ico) * -${c}) calc(var(--ico) * -${r})"></div>`;
}
function icoPair(it){
  const sh = it.shinyId ? byId[it.shinyId] : null;
  return `<span class="icopair">${ico(it.sp)}${sh?ico(sh.sp):""}</span>`;
}
// Items roll 0-4 enchant slots. The pips are the item's slot capacity; they borrow the
// enchant-level colour ramp (green/blue/purple/gold) purely as a scale, and mean
// "how many slots are guaranteed", not a rarity.
function slotPips(it){
  const ch = it.chance;
  if(!ch || !ch.length) return `<span class="dim">&mdash;</span>`;
  // slotChance is CUMULATIVE: entry k is P(at least k+1 slots). Every one of the 2,069
  // lists in equip.xml is monotone non-increasing, which a per-slot independent reading
  // would not require. So P(exactly n) = ch[n-1] - ch[n], and "guaranteed" is the run of
  // leading 1.0s - the number of slots the item ALWAYS drops with.
  const guaranteed = (()=>{ let n=0; while(n<ch.length && ch[n]>=1) n++; return n; })();
  // Colour by how many slots are GUARANTEED - that is what separates a great drop
  // from an average one. Solid pip = always rolls. Hollow = a chance. Dark = never.
  const v = TIERS[Math.max(1,guaranteed)] || TIERS[4];
  const pc = x => Math.round(x*1000)/10;
  const exact = ch.map((x,k)=> pc(x - (ch[k+1]||0)));
  const tip = "chance of dropping with exactly N slots — " +
              exact.map((x,k)=>`${k+1}: ${x}%`).join(" · ") +
              (ch[0]<1?` · none: ${pc(1-ch[0])}%`:"") +
              (it.dust?` · costs ${it.dust.amounts||"?"} ${it.dust.type}`:"");
  return `<span class="pips" title="${esc(tip)}">` + Array.from({length:4},(_,k)=>{
    const x = ch[k]==null?0:ch[k];
    if(x>=1)  return `<i style="background:${v[1]}"></i>`;
    if(x>0)   return `<i style="background:transparent;box-shadow:inset 0 0 0 1px ${v[1]}"></i>`;
    return `<i style="background:transparent;box-shadow:inset 0 0 0 1px var(--line-soft)"></i>`;
  }).join("") + `</span>`;
}
function bagIco(it){
  const b = SP.bags && it.bag != null ? SP.bags[String(it.bag)] : null;
  if (b == null) return "";
  return ico(b);
}
function srcText(it){
  if (!it.sources.length) return `<span class="dim">—</span>`;
  return it.sources.map(s => s.name ? `<span class="src">${esc(s.name)}</span>`
      : `<span class="src raw">${esc("ORG_"+s.code)}</span>`).join(", ");
}
// Table version: show the dungeon's own door sprite, name it on hover.
// Sources with no portal (event whites, alien invasion, unmapped codes) keep a text chip
// rather than borrowing some other dungeon's door.
const SRCI = D.sourceIcons || {};
// How you get an ST set, straight out of the captured page's own prose. Not a dungeon:
// "obtainable from enemies as rare drops in orange bags", and for the newest set of each
// class also "Mystery ST Chests, which can be acquired through Mystery Boxes, packages,
// campaigns". Previous generations lose the purchase routes and keep the drop.
const SETGEN = D.setGen || {};
const GENLBL = {"1st":"gen 1", "2nd":"gen 2", "3rd":"gen 3",
                reskin:"reskin", legacy:"legacy", vanity:"vanity"};
function GENWHY(g){
  const who = `${g.cls} · ${GENLBL[g.gen]||g.gen}`;
  if(g.gen === "legacy") return `${who} — replaced by a newer version and no longer obtainable.`;
  if(g.gen === "reskin") return `${who} — a seasonal reskin; it comes back with its event.`;
  if(g.gen === "vanity") return `${who} — a joke set, deliberately weak.`;
  if(g.current) return `${who}, the CURRENT set for this class — campaigns, Mystery Boxes`
    + ` and Mystery ST Chests, plus rare orange-bag drops from enemies. No single dungeon:`
    + ` the client files do not name one and neither does the captured page.`;
  return `${who} — a previous generation. Drops only now: rare orange-bag drops from`
    + ` enemies, no longer purchasable. No single dungeon.`;
}

function srcDoors(it){
  // Tiered gear now resolves to its own "Any dungeon" source in the data, so it never
  // reaches here. Only a real gap does - and for a UT or ST that gap is the honest answer.
  if (!it.sources.length){
    return `<span class="dim" title="nothing in the client files, the RealmEye capture or the derived layer says where this drops — for a UT or ST that is a genuine gap">—</span>`;
  }
  // Art only, name on hover. Spelling out "Cnidarian Reef" in every row ate 330px of a
  // table whose other columns needed it, and the door is what you recognise anyway.
  const parts = it.sources.map(s => {
    const key = s.name || ("ORG_" + s.code);
    const e = SRCI[key] || {};
    const label = key + (e.diff != null ? `  ·  difficulty ${e.diff}` : "") +
                  (s.note ? `  ·  ${s.note}` : "");
    return {key, e, label, named: !!s.name};
  });
  const first = parts[0];
  // An ST set's art is a CHARACTER, not a door, and at 16px the two are easy to confuse.
  // Give it its own frame so a set reads as a set at a glance.
  const art = p => p.e.sp != null
      ? `<span class="door${p.e.kind==="set"?" set":""}" title="${esc(p.label)}">${
          ico(p.e.sp)}${p.e.boss!=null?ico(p.e.boss):""}</span>`
      : "";
  const rest = parts.slice(1);
  // A source with no door art has nothing to show, so it keeps its name - an event or an
  // ST set would otherwise be a blank cell.
  const nameless = parts.filter(p => p.e.sp == null);
  // A set on its own used to say nothing, because the client has no dungeon for one.
  // The captured Set Tier Items page does not have dungeons either - ST sets do not have
  // one - but it does say which GENERATION a set is, and that decides how you get it.
  const setOnly = parts.length === 1 && parts[0].e.kind === "set";
  const gen = setOnly ? SETGEN[parts[0].key] : null;
  return `<span class="dropin">
      <span class="doors">${parts.map(art).join("")}</span>
      ${nameless.length?`<span class="dname" title="${esc(nameless[0].label)}">${
        esc(nameless[0].key)}</span>`:""}
      ${setOnly?`<span class="gen ${gen?esc(gen.gen):""}${gen&&gen.current?" cur":""}"
        title="${gen?esc(GENWHY(gen)):esc(parts[0].key)}">${
        gen?esc(GENLBL[gen.gen]||gen.gen):"set only"}</span>`:""}
    </span>`;
}
function tierTag(it){
  let h = it.tier ? `<span class="tg tg-${it.tier}">${esc(it.tier)}</span>` : "";
  if (it.shinyId) h += ` <span class="tg tg-sh">SH</span>`;
  if (it.legacy) h += ` <span class="tg tg-old" title="legacy re-release; shares its name with the current item">OLD</span>`;
  return h;
}
// A shiny is shown as a second sprite on its base row, so it must not also be its own
// row. Shinies with no base (nothing to fold into) still appear.
const slotItems = slot => D.items.filter(i => i.slot === slot && !i.baseOf);

function filterFn(){
  const q  = ($("#q") && $("#q").value || "").trim().toLowerCase();
  const tr = $("#tier") ? $("#tier").value : "";
  const sf = $("#srcf") ? $("#srcf").value : "";
  const hr = $("#hidere") && $("#hidere").checked;
  const sg = $("#showgone") && $("#showgone").checked;
  const statSel = $("#statf") ? $("#statf").value : "";
  return it => {
    // "Which of these specs the stat I am building?" - the question the whole table
    // exists to answer. All four kinds count, because all four are reasons to pick it.
    if (statSel){
      const hit = (it.bonus && it.bonus[statSel] != null)
        || (it.cond || []).some(c => c.stat === statSel)
        || (it.scaled || []).some(x => x.stat === statSel || x.of === statSel)
        || (it.scal || []).includes(statSel);
      if (!hit) return false;
    }
    if (tr && it.tier !== tr) return false;
    // Read it.sk, NOT sources.length. Since source resolution landed, almost every item
    // carries SOME source - set, event, community, inherited, or "any dungeon" for tiered.
    // Testing sources.length would make "has a dungeon" pass RealmEye guesses and make
    // "missing" return nothing at all.
    if (sf === "known" && it.sk !== "dungeon" && it.sk !== "boss") return false;
    if (sf === "gap" && (it.sk !== "none" || (it.tier !== "UT" && it.tier !== "ST"))) return false;
    // Unobtainable items are out of the way unless you ask for them. The list is
    // curated in data/unobtainable.json because the client does not mark them.
    //
    // Legacy re-releases ride the same switch. They cannot be obtained either, and an
    // OLD badge next to a name you recognise is worse than not showing it: it reads as
    // a farmable item until you notice the tag.
    if (!sg && (it.gone || it.legacy)) return false;
    if (hr && (it.reskin || it.shiny)) return false;
    if (q){
      const hay = (it.name+" "+it.desc+" "+it.sources.map(s=>s.name||s.code).join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  };
}
