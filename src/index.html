function drawDetail(){
  const el=$("#detail"); if(!el) return;
  const it = S.sel && byId[S.sel];
  if(!it){ el.className="detail empty"; el.textContent="Click an item for its stats and description."; return; }
  el.className="detail";
  const sh = it.shinyId ? byId[it.shinyId] : null;
  const shinyDiffers = sh && (sh.rel !== it.rel || JSON.stringify(sh.dmg) !== JSON.stringify(it.dmg));
  const rows=[]; const add=(k,v)=>{ if(v!=null&&v!=="") rows.push(`<div class="drow"><span>${k}</span><span>${v}</span></div>`); };
  add("Slot", it.slotName); add("Type", it.tier||"—");
  // Weapons get the full damage table below instead; repeating the same four numbers
  // here just made the reader check whether they agreed.
  const isWeapon = WEAPON_SLOT_SET.has(it.slot);
  if(!isWeapon){
    if(it.dmg) add("Damage", `${it.dmg[0]}–${it.dmg[1]}`);
    if(it.rof!=null) add("Rate of fire", it.rof+"×");
    if(it.shots!=null) add("Shots", it.shots);
    if(it.rel!=null) add("Proc damage*", Math.round(it.rel));
  }
  if(it.mp!=null) add("MP cost", it.mp);
  if(it.chance) add("Slot odds", it.chance.map((x,k)=>
      `${k+1}:${x>=1?"100":x<=0?"0":Math.round(x*100)}%`).join(" "));
  add("Enchant slots", it.ench); add("Feed power", it.feed);
  if(it.dust) add("Enchant dust", `${esc(it.dust.type||"?")} · ${esc(it.dust.amounts||"?")}`);
  if(it.bag!=null) add("Loot bag", `<span class="icopair" style="--ico:20px">${bagIco(it)}</span>`);
  if(it.pw!=null) add("PowerLevel", it.pw);
  if(it.mps!=null) add("MP drain", it.mps+"/sec");
  if(it.multi) add("Sub-attacks", it.multi);
  add("Soulbound", it.soulbound?"yes":"no"); add("Tradeable", it.tradeable?"yes":"no");
  if(it.ptag) add("Game power tag", esc(it.ptag));
  const bonus = it.bonus ? Object.entries(it.bonus).map(([k,v])=>
      `<div class="drow"><span>${esc(k)}</span><span class="num hi">${v>0?"+":""}${v}</span></div>`).join("") : "";
  // Scaled bonuses are a different kind of number and must never be summed with flat ones.
  const scaled = it.scaled ? it.scaled.map(x=>
      `<div class="drow"><span>${esc(x.stat)}</span><span class="num" style="color:var(--shiny)">${
        x.amt>0?"+":""}${x.amt}${x.of?` of ${esc(x.of)}`:""}</span></div>`).join("") : "";
  const effects = it.effects ? it.effects.map(x=>
      `<div style="margin:5px 0"><div class="nm">${esc(x.name||"Effect")}</div>
       <div class="dim" style="white-space:normal">${esc(x.desc)}</div></div>`).join("") : "";
  // Provenance, per source. This used to label EVERY note "player knowledge" - which was
  // true when the only note was ORG_NOTES/UMI, and became an outright inversion once the
  // client's own <EffectInfo name="Drop location"> text and forgeProperties.xml started
  // supplying notes. The one genuinely external layer is kind:"community"; it now says so,
  // and nothing else claims to.
  const PROV = {
    community: "Player knowledge (RealmEye), not from the game files:",
    derived:   "Inferred from the client files, not stated outright:",
    collection: "Every other item in this dungeon's collection agrees:",
    inherit:   "Taken from this item's base printing:",
  };
  const prov = s => PROV[s.via] || PROV[s.kind] || "From the game files:";
  const notes = it.sources.filter(s=>s.note).map(s=>
      `<span class="note ${s.via==="derived"||s.kind==="community"?"soft":""}"><b>${prov(s)}</b> ${
        esc(s.note)}${s.conf?` (confidence: ${esc(s.conf)})`:""}</span>`).join("");
  el.innerHTML = `<div class="dhead">${ico(it.sp)}${sh?ico(sh.sp):""}
      <div><h3>${esc(it.name)}</h3><div>${tierTag(it)}</div></div></div>
    ${it.desc?`<div class="ddesc">${esc(it.desc)}</div>`:""}
    ${shinyDiffers?`<span class="note"><b>The shiny version is not just cosmetic here.</b>
      ${esc(sh.name)}: ${sh.dmg?`${sh.dmg[0]}–${sh.dmg[1]} dmg`:""}${
      sh.rel!=null?`, DPS* ${Math.round(sh.rel)} vs ${it.rel!=null?Math.round(it.rel):"?"}`:""}.</span>`:""}
    <div class="dsec">Stats</div>${rows.join("")}
    ${damagePanel(it)}
    ${bonus?`<div class="dsec">On equip — flat</div>${bonus}`:""}
    ${scaled?`<div class="dsec">On equip — scaled off another stat</div>${scaled}
       <div class="dim" style="margin-top:4px">These are not flat points and are <b>not</b> added to
       the Kit totals.</div>`:""}
    ${effects?`<div class="dsec">Effects</div>${effects}`:""}
    <div class="dsec">Source</div><div>${srcText(it)}</div>${notes}
    ${isWeapon?"":`<div class="dsec">Notes</div>`}
    ${isWeapon?"":`<div class="dim">* Proc damage = average damage × rate of fire × shots, summed across every
    sub-attack the item declares. Good for ranking weapons of the same class against each other.
    It is <b>not</b> scaled by your ATT or DEX, and it is not the number the game shows you.
    ${it.multi?`This item fires <b>${it.multi} sub-attacks</b>, so treat it as an estimate.`:""}
    ${it.relAssumed?`This item declares no rate of fire, so 1× was assumed.`:""}</div>`}
    ${it.ptag?`<div class="dim" style="margin-top:8px">The game's power tag (${esc(it.ptag)}) is
    <b>not</b> a quality ranking — tiers overlap heavily and some strong items carry none at all.
    Use DPS and the on-equip bonuses instead.</div>`:""}`;
}

function kitView(){
  const c=cls(), kit=S.kit[S.cls]||[null,null,null,null];
  const slots=c.slots.map((s,i)=>{ const it=kit[i]&&byId[kit[i]];
    return `<div class="kitslot ${it?"filled":""}"><div class="lbl">${SLOTLBL[i]} · ${esc(c.slotNames[i])}</div>
      <div class="pick" data-kitslot="${i}">${it?ico(it.sp):`<div class="ico none"></div>`}
      <div>${it?`<div class="nm">${esc(it.name)}</div><div class="dim">${it.rel!=null?"DPS* "+Math.round(it.rel):""}</div>`
      :`<div class="dim">click to choose</div>`}</div></div></div>`; }).join("");
  // Three separate buckets, because they are three different kinds of number and adding
  // them together is how a totals panel starts lying.
  //   gear      flat <ActivateOnEquip amount=".." stat=".."> on the equipped item
  //   ench      the same element on the enchantments you have PLANNED for those items
  //   scaled    "+7% of ATT" rows, from either - these depend on the total they would be
  //             added to, and the client never states the order the game applies them in
  const tot={}, fromGear={}, fromEnch={};
  D.stats.forEach(s=>{ tot[s]=0; fromGear[s]=0; fromEnch[s]=0; });
  const scaledRows=[];
  kit.forEach(id=>{ const it=id&&byId[id];
    if(!it) return;
    if(it.bonus) Object.entries(it.bonus).forEach(([k,v])=>{
      if(k in tot){ tot[k]+=v; fromGear[k]+=v; } });
    (it.scaled||[]).forEach(x=>scaledRows.push({src:it.name, ...x}));
    // The enchantments you planned are as real as the item once they are rolled, and
    // leaving them out was the difference between "+3 ATT" and the "+21 ATT" this ring
    // actually gives.
    (S.ench[it.id]||[]).forEach(eid=>{ const e=eid&&enchById[eid]; if(!e) return;
      (e.mut||[]).forEach(m=>{
        if(!m.stat || m.amt==null) return;
        if(m.of){ scaledRows.push({src:e.name, stat:m.stat, amt:+m.amt, of:m.of}); return; }
        if(m.stat in tot){ tot[m.stat]+=+m.amt; fromEnch[m.stat]+=+m.amt; }
      });
    });
  });
  const round1=x=>Math.round(x*10)/10;
  // A trade-off enchantment takes a stat away, and "+-30" is not a number anybody reads.
  const signed=x=>(x>0?"+":"")+round1(x);
  const base=c.base||{}, mx=c.max||{};
  const useMax = !S.lvl1;
  const src = useMax ? mx : base;
  const stats=D.stats.map(s=>`<div class="stat"><div class="k">${
      STATSP[s]!=null?`<span class="sico">${ico(STATSP[s])}</span>`:""}<span style="color:${
      STATCOL[s]||"var(--ink-faint)"}">${STAT3[s]||s}</span></div>
      <div class="v">${round1((src[s]||0)+tot[s])}</div>
      <div class="dim" style="font-size:10.5px">${Math.round(src[s]||0)} ${useMax?"maxed":"base"}${
        fromGear[s]?` <span class="b ${fromGear[s]<0?"neg":""}" title="from your gear">${signed(fromGear[s])}</span>`:""}${
        fromEnch[s]?` <span class="e ${fromEnch[s]<0?"neg":""}" title="from the enchantments you planned">${signed(fromEnch[s])}</span>`:""}</div>
      </div>`).join("");
  const scaled = scaledRows.length ? `<div class="dsec">Scaled off another stat</div>
    <div class="dim" style="margin-bottom:6px">These are a percentage of a stat, not points,
      so they are <b>not</b> in the totals above &mdash; the client never says in what order
      the game applies them.</div>
    ${scaledRows.map(x=>`<div class="drow"><span>${esc(x.src)}</span>
      <span>${statChip(x.stat, x.amt, x.of)}</span></div>`).join("")}` : "";
  const w = kit[0]&&byId[kit[0]];
  return `<div class="kit">
    <div class="dsec">Kit · ${esc(S.cls)}</div><div class="kitslots">${slots}</div>
    <div class="dim" style="margin-bottom:10px">Click a slot, then click an item to equip it.
      Saved in this browser.</div>
    <div class="dsec">Totals — class stats + gear</div>
    <label class="dim" style="display:flex;gap:6px;align-items:center;margin-bottom:8px;cursor:pointer">
      <input type="checkbox" id="lvl1" ${S.lvl1?"checked":""}> show level-1 base instead of maxed</label>
    <div class="statgrid">${stats}</div>
    ${scaled}
    <div class="dsec">Enchantments</div>
    <div class="dim" style="margin-bottom:9px">Click a slot to choose what you want rolled.
      Right-click one to hold it through a reroll. <b>Roll</b> draws from the enchantments
      that can legally sit on that item, weighted the way the game weights them &mdash; the
      reroll itself is this app's idea, the client has no such mechanic.</div>
    ${kit.every(x=>!x)
      ? `<div class="dim">Equip something above first.</div>`
      : `<table class="items"><tbody>${kit.map(id=>id&&byId[id]).filter(Boolean)
            .map(trackRow).join("")}</tbody></table>`}
    ${w?damagePanel(w):`<div class="dsec">Damage</div>
      <div class="dim">No weapon equipped.</div>`}
    <div class="dsec">Honest limits</div>
    <div class="dim">Class stats are read straight from the game files — both the level-1 base and
      the <b>maxed</b> value (the <code>max</code> attribute on each stat). Gear and enchantment
      bonuses are exact, from the <b>flat</b> on-equip effects of each. <b>Not counted:</b>
      percentage/scaled bonuses (listed above on their own), conditional buffs that only apply
      while shooting or after an ability, exaltations, or the pet — and the enchantments counted
      here are the ones you have <b>planned</b>, not ones you have rolled.</div></div>`;
}

function dungeonsView(){
  // Count by SOURCE CODE, not display string - a name join silently missed most dungeons.
  // Community matches, boss prose, forge requirements and inherited sources are not this
  // dungeon's own tag, so they are counted separately rather than inflating the number.
  // Count only the rows the drill-in will actually show: a shiny is folded onto its base
  // there, so counting it here made the header promise more items than the list had.
  const counts={}, loose={};
  D.items.filter(i=>!i.baseOf).forEach(i=>i.sources.forEach(s=>{
    const k=s.name||("ORG_"+s.code);
    loose[k]=(loose[k]||0)+1;
    if (s.kind==="dungeon") counts[k]=(counts[k]||0)+1; }));

  if(S.dgAt) return dungeonDrops(S.dgAt);

  const rows=D.portals.slice().sort((a,b)=>{
      // Hardest last: this reads as a progression, same as Track.
      const da=a.diff, db=b.diff;
      if(da==null && db==null) return a.name.localeCompare(b.name);
      if(da==null) return 1;
      if(db==null) return -1;
      return da-db; })
    .map(p=>{
      const n=counts[p.name]||0, ln=loose[p.name]||0;
      return `<button class="dgrow" type="button" ${ln?`data-dgat="${esc(p.name)}"`:""}
          ${ln?"":'style="opacity:.45;cursor:default"'}>
        <span class="art">${ico(p.sp)}${p.boss!=null?ico(p.boss):""}</span>
        <span class="txt"><span class="nm">${esc(p.name)}</span>
          <span class="dim">${ln?`${ln} item${ln==1?"":"s"} drop here`:"nothing recorded from here"}</span></span>
        ${p.diff!=null?`<span class="diff" title="dungeon difficulty from the game files, 0-10">${p.diff}</span>`
                      :`<span class="diff none">&mdash;</span>`}
        <span class="chev">${ln?"&#8250;":""}</span>
      </button>`;}).join("");

  return `<div class="hint">Every dungeon portal in the client, easiest first.
    <b>Difficulty</b> is the game's own rating, stored on the dungeon keys in
    <code>equipKeys.xml</code> &mdash; present for ${D.portals.filter(p=>p.diff!=null).length}
    of ${D.portals.length}. Click one to see what drops there.</div>
    <div class="scroll"><div class="dglist">${rows}</div></div>`;
}

function dungeonDrops(name){
  const e=SRCI[name]||{};
  const drops=D.items.filter(i=>!i.baseOf && i.sources.some(s=>(s.name||("ORG_"+s.code))===name));
  const bio=BIOME_OF[name];
  return `<div class="hint"><button class="mini" data-dgback>&#8249; all dungeons</button></div>
    <div class="dghead">
      <span class="art">${e.sp!=null?ico(e.sp):""}${e.boss!=null?ico(e.boss):""}</span>
      <div style="min-width:0"><div class="nm">${esc(name)}</div>
        <div class="dim">${drops.length} item${drops.length==1?"":"s"}${
          e.diff!=null?` &middot; difficulty ${e.diff}`:""}</div></div>
      ${bio?`<button class="mini" data-biome="${esc(bio)}">show in bestiary</button>`:""}
    </div>
    <div class="scroll">${drops.length?`<table class="items"><tbody>${drops.map(i=>`
      <tr data-id="${esc(i.id)}" class="${S.track.includes(i.id)?'tracked':''}"
          title="click to track / untrack">
        <td style="width:82px">${icoPair(i)}</td>
        <td class="nm" style="width:300px">${esc(i.name)} ${tierTag(i)}</td>
        <td style="width:46px">${bagIco(i)}</td>
        <td style="width:66px" class="num ${i.rel?"hi":""}">${i.rel!=null?Math.round(i.rel):""}</td>
        <td style="width:110px" class="dim">${esc(i.slotName)}</td>
        <td></td></tr>`).join("")}</tbody></table>`
      :`<div class="empty">Nothing recorded from here.</div>`}</div>`;
}

// ---------------------------------------------------------------------------
// Pets
//
// Two things this page will not do, and the reason is the same for both: the
// client does not contain them.
//
//   * It will not tell you what an ability does AT YOUR LEVEL. pets.xml gives the
//     value at the ability's lowest level and its highest, and names the curve
//     between them - exp_incr, dim_returns, exp_decr, linear. No file in the dump
//     defines any of those four, and no file states what level range the endpoints
//     span. So the endpoints are shown, and nothing is drawn between them.
//   * It will not convert feed power into levels. feedPower is a per-item number
//     and nothing in the game files consumes it. A feed calculator that is
//     confidently wrong costs somebody an evening of real drops.
//
// What it does do is exact: every feedable item's worth, the tier ladders, and the
// two ends of every ability. If a community table for the level curve ever lands in
// data/, this is where it plugs in.
// ---------------------------------------------------------------------------
const PETS = D.pets || {};

// A level picker that drives both halves of the pets page: what the ability does at that
// level, and what it cost to get there. S.petLv is the pet's ability level, 1-100.
const PLV = () => PETS.levels;

// "21 every 2.85s — 7.4/sec" plus the sheet's own stat-equivalent column.
function abilityAtLevel(key, lv){
  const L = PLV(); if(!L || !L.abil || !L.abil[key]) return null;
  return L.abil[key].find(r => r[0] === lv) || null;
}

function petLevelBar(){
  const L = PLV();
  if(!L) return "";
  const lv = S.petLv;
  return `<div class="bar" style="border-top:1px solid var(--line-soft)">
    <label>ability level
      <input type="range" id="petlv" min="1" max="100" value="${lv}" style="width:190px">
    </label>
    <b style="color:var(--accent);font-variant-numeric:tabular-nums">${lv}</b>
    <span class="spacer" title="${esc(L.source)}">levels are community data, not game files</span>
  </div>`;
}

// The two heal abilities are the ones every player runs, and "how much is this actually
// healing me for" is the question the client can only answer at the two ends.
function healAtLevel(a){
  const key = a.id === "Heal" ? "Heal" : a.id === "Magic Heal" ? "MagicHeal" : null;
  if(!key) return "";
  const row = abilityAtLevel(key, S.petLv);
  if(!row) return "";
  const [lv, amt, delay, ps, eq] = row;
  const unit = key === "Heal" ? "HP" : "MP";
  const stat = key === "Heal" ? "VIT" : "WIS";
  return `<div class="atlv">
    <div class="k">at level ${lv}</div>
    <div class="v"><b>${amt}</b> ${unit} every <b>${delay}</b>s
      <span class="dim">&mdash; ${ps} ${unit}/sec</span></div>
    <div class="dim">worth about <b>${eq}</b> ${stat} of regeneration, by the same table.</div>
  </div>`;
}

function petsView(){
  const tabs = [["ability","Abilities"],["feed","Feed"]].map(([k,l])=>
    `<button class="pettab" type="button" data-ptab="${k}"
       aria-selected="${(S.ptab||"ability")===k}">${l}</button>`).join("");
  return `<div class="pettabs">${tabs}</div>
    <div class="bar">
      <input type="search" id="q" placeholder="${(S.ptab||"ability")==="feed"
        ? "food, egg or item name…" : "ability name…"}" autocomplete="off">
      ${(S.ptab||"ability")==="feed"
        ? `<label title="Any equippable item can be sacrificed to a pet. Off, this lists
             only what the client marks as pet food, plus the eggs."><input type="checkbox"
             id="petgear" ${S.petGear?"checked":""}> include gear you can feed</label>
           <label title="Dev objects and items that can no longer be obtained. The game files
             do not mark these, so the list is curated by hand in data/unobtainable.json."><input
             type="checkbox" id="showgone"> show unobtainable</label>`
        : ""}
      <span class="spacer" id="count"></span>
    </div>
    ${(S.ptab||"ability")==="ability"?petLevelBar():""}
    <div class="scroll" id="list"></div>`;
}

// "10 -> 90 · exp_incr", or "4.5" for a constant. Never a value in between.
function pparam(p){
  const scaling = p.min != null && p.max != null;
  const v = scaling
    ? `${esc(p.min)}<span class="to">&rarr;</span>${esc(p.max)}`
    : esc(p.value != null ? p.value : "—");
  return `<div class="prow${p.in?" sub":""}">
    <span class="k">${esc(p.name)}</span><span class="v">${v}</span>
    ${p.curve?`<span class="c" title="The client names this curve and defines it nowhere.">${esc(p.curve)}</span>`:""}
  </div>`;
}

// Internal plumbing, not something a player can act on: which projectile object the
// ability fires, its tint, and how it aims. DamageCurve is not dropped but MOVED - it is
// the curve for the projectile damage row, which is drawn separately below.
const PET_PARAM_HIDE = new Set(["ProjectileId", "Color", "AimType", "DamageCurve"]);

function petAbilityCard(a){
  const params = (a.params||[]).filter(p=>!PET_PARAM_HIDE.has(p.name)).map(pparam).join("");
  const dmgCurve = (a.params||[]).find(p=>p.name==="DamageCurve");
  // The shoot abilities carry no damage of their own - it lives on the projectile they
  // name. Joined on ProjectileId, never on ObjectId: all three share "Pet Bullet 3",
  // and that object has no damage at all.
  const proj = a.proj ? `<div class="prow"><span class="k">Damage</span>
      <span class="v">${a.proj.min}<span class="to">&rarr;</span>${a.proj.max}</span>
      ${dmgCurve?`<span class="c" title="The client names this curve and defines it nowhere.">${
        esc(dmgCurve.value)}</span>`:""}</div>` : "";
  const first = (a.first||[]).length;
  return `<div class="pcard">
    <div class="pnm">${esc(a.id)}</div>
    <div class="grp">${esc(a.group||"")}${a.base?` &middot; ${esc(a.base)}`:""}</div>
    <div class="dim" style="margin-bottom:7px;line-height:1.5">${esc(a.desc||"")}</div>
    ${healAtLevel(a)}
    ${proj}${params}
    <div class="prow"><span class="k">Starter pets</span>
      <span class="v">${first||"&mdash;"}</span>
      <span class="c" title="${first?esc((a.first||[]).join(", ")):"no pet in the files opens with this"}">${
        first?"hover to list":"none declare it"}</span></div>
  </div>`;
}

function drawPets(){
  const q=(($("#q")||{}).value||"").trim().toLowerCase();
  if((S.ptab||"ability")==="ability"){
    const rows=(PETS.abilities||[]).filter(a=>!q ||
      (a.id+" "+(a.group||"")+" "+(a.desc||"")).toLowerCase().includes(q));
    $("#count").textContent=`${rows.length} of ${(PETS.abilities||[]).length}`;
    $("#list").innerHTML =
      `<div class="hint">The <b>min &rarr; max</b> columns are the endpoints the game files
        declare &mdash; an ability's value at its lowest level and at its highest. The curve
        between them is named in <code>pets.xml</code> and <b>defined nowhere</b> in the client.
        ${PLV()?`The <b>at level</b> boxes fill that gap from a community table, not from the
        game files, and it says so: <span class="dim">${esc(PLV().source)}</span>`
        :`So the app shows both ends and nothing in between &mdash; put a table into
        <code>data/pet-levels.json</code> and it will.`}</div>` +
      `<div class="pgrid">${rows.map(petAbilityCard).join("")}</div>` +
      petFootnotes();
    return;
  }
  // ---- feed ----
  // Same checkbox, same source of truth as the Items table: read the DOM, not a copy.
  const sg = $("#showgone") && $("#showgone").checked;
  let rows=(PETS.food||[]).filter(r=>sg || !r.gone);
  if(S.petGear){
    // Gear feed power is already on each item; fold it in rather than duplicating it
    // into the pets payload. Shinies fold onto their base row the way they do elsewhere.
    D.items.filter(i=>i.feed!=null && !i.baseOf).forEach(i=>rows.push(
      {id:i.id, name:i.name, feed:+i.feed, kind:"gear", sp:i.sp, bag:i.bag, item:i.id}));
    rows.sort((a,b)=>b.feed-a.feed || a.name.localeCompare(b.name));
  }
  if(q) rows=rows.filter(r=>(r.name+" "+(r.desc||"")+" "+(r.fam||"")).toLowerCase().includes(q));
  $("#count").textContent=`${rows.length} feedable`;
  const shown=rows.slice(0,600);
  $("#list").innerHTML =
    `<div class="hint">What each thing is worth as pet food, straight out of the game files.
      Items the client marks <code>PETBLACKLIST</code> are left out &mdash; they advertise a
      feed power the game will not accept.</div>` +
    `<table class="items"><thead><tr>
       <th style="width:60px"></th><th style="width:280px">Item</th>
       <th style="width:46px">Bag</th>
       <th style="width:78px" class="num" title="feedPower, from the game files">Feed</th>
       <th style="width:190px">Where</th><th></th></tr></thead><tbody>${
      shown.map(r=>{
        const it = r.item && byId[r.item];
        return `<tr${it?` data-id="${esc(r.id)}"`:""}>
        <td>${r.sp!=null?ico(r.sp):`<div class="ico none"></div>`}</td>
        <td class="nm">${esc(r.name)} ${r.kind==="egg"
            ? `<span class="tg tg-old" title="${esc(r.fam||"")}">EGG</span>` : ""}</td>
        <td>${r.bag!=null?ico((SP.bags||{})[String(r.bag)]):""}</td>
        <td class="num hi">${r.feed.toLocaleString()}</td>
        <td>${it?srcDoors(it):`<span class="dim">${esc(r.rar||r.fam||"")}</span>`}</td>
        <td></td></tr>`;}).join("")}</tbody></table>` +
    (rows.length>shown.length?`<div class="empty">Showing ${shown.length} of ${rows.length}. Narrow it down.</div>`:"") +
    (rows.length?"":`<div class="empty">Nothing matches.</div>`) +
    petLevelCalc() + petLadders() + petFootnotes();
}

// The one calculator this app will do, and only when a human has put a table in
// data/pet-levels.json. No table, no calculator - the game files contain nothing that
// relates feed power to a level, and an invented coefficient here would send someone to
// farm the wrong thing for an evening.
function petLevelCalc(){
  const L = PETS.levels;
  if(!L) return `<div style="padding:4px 13px 16px">
    <div class="dsec">How much feed to reach a level</div>
    <div class="dim">Not shown, because the game files do not contain it &mdash; there is no
      XP value, no per-level table and no cap by rarity anywhere in the client. Put a
      community table you trust into <code>data/pet-levels.json</code> (it explains the
      shape) and re-run the build; this turns into a calculator and labels every number
      it draws from that file.</div></div>`;
  // A pet levels each ability slot separately and the later ones cost far more for the
  // same level - the third is roughly 3.3x the first at 100 - so the slot is part of the
  // question, not a detail.
  const slot = S.petSlot || "first";
  const rows=(L.by && L.by[slot]) || L.feedToLevel, lv=rows.map(r=>r[0]);
  const cum=Object.fromEntries(rows);
  const from=S.petFrom!=null?S.petFrom:lv[0], to=S.petTo!=null?S.petTo:lv[lv.length-1];
  const opt=(sel)=>lv.map(n=>`<option value="${n}"${n===sel?" selected":""}>${n}</option>`).join("");
  const have=cum[from], want=cum[to];
  const need = (have!=null && want!=null) ? want-have : null;
  // What to feed, cheapest-first by item count. Straight greedy over the feed table,
  // which is optimal here because every larger value is a multiple-ish of the smaller
  // ones and the answer is a shopping list, not a proof.
  let plan="";
  if(need!=null && need>0){
    const pool=(PETS.food||[]).filter(f=>!f.gone && f.feed>0)
                              .sort((a,b)=>b.feed-a.feed).slice(0,60);
    let left=need; const take=[];
    for(const f of pool){
      const n=Math.floor(left/f.feed);
      if(n>0){ take.push([f,n]); left-=n*f.feed; }
      if(left<=0) break;
    }
    plan = `<div class="dsec">One way to get there</div>` +
      (take.length?`<table class="items"><tbody>${take.map(([f,n])=>`<tr>
        <td style="width:60px">${f.sp!=null?ico(f.sp):`<div class="ico none"></div>`}</td>
        <td class="nm" style="width:260px">${esc(f.name)}</td>
        <td class="num">&times;${n}</td>
        <td class="num hi">${(f.feed*n).toLocaleString()}</td><td></td></tr>`).join("")}</tbody></table>`
        :`<div class="dim">Nothing in the food table is small enough.</div>`) +
      (left>0?`<div class="dim">&hellip;and ${left.toLocaleString()} feed power still short of a
        whole item &mdash; anything on the list above covers it.</div>`:"");
  }
  return `<div style="padding:4px 13px 16px">
    <div class="dsec">How much feed to reach a level</div>
    <div class="note">These numbers are <b>not from the game files</b>. They come from
      <code>data/pet-levels.json</code>: ${esc(L.source)}</div>
    <div class="bar" style="padding:9px 0;border:0">
      <label>ability <select id="petslot">${["first","second","third"].map(k=>
        `<option value="${k}"${k===slot?" selected":""}>${k}</option>`).join("")}</select></label>
      <label>from level <select id="petfrom">${opt(from)}</select></label>
      <label>to <select id="petto">${opt(to)}</select></label>
      <span class="spacer">${need==null?"not in the table"
        : need<=0 ? "already there"
        : `<b style="color:var(--accent)">${need.toLocaleString()}</b> feed power`}</span>
    </div>${plan}</div>`;
}
function petLadders(){
  const rows=(PETS.ladders||[]).map(l=>`<div class="dsec">${esc(l.names.join(" · "))}</div>
    <div class="ladder">${l.rows.map(([t,f])=>
      `<b>T${t} <i>${f.toLocaleString()}</i></b>`).join("")}</div>`).join("");
  const y=(PETS.yard||[]).filter(r=>r.price!=null).map(r=>
    `<div class="drow"><span>Yard ${esc(String(r.yard))}</span>
     <span>${r.price.toLocaleString()} gold &middot; ${r.fame.toLocaleString()} fame</span></div>`).join("");
  return `<div style="padding:4px 13px 16px">
    <div class="dsec">Tiered gear, by tier</div>
    <div class="dim">Every tiered item of the same slot and tier is worth exactly the same
      feed, with no exceptions in the whole file &mdash; so this is the answer for the pile
      of tiered junk, without looking anything up.</div>
    ${rows}
    ${y?`<div class="dsec">Pet Yard upgrades</div>${y}`:""}</div>`;
}

function petFootnotes(){
  return `<div style="padding:0 13px 18px">
    <div class="dsec">What the game files do not contain</div>
    <div class="dim" style="line-height:1.6">
      <b>How much feed a level costs.</b> <code>feedPower</code> is a number on an item and
      nothing in the client consumes it &mdash; there is no XP value, no per-level table and no
      cap by rarity anywhere in the 246 files. So this app cannot tell you how much to feed to
      reach a level, and does not guess.<br>
      <b>The curve between the two ends.</b> Four curve names are used
      (<code>exp_incr</code>, <code>dim_returns</code>, <code>exp_decr</code>, <code>linear</code>)
      and not one of them is defined on disk.<br>
      <b>What level the ends are.</b> No file states a floor or ceiling for a pet or an
      ability level &mdash; the 1&ndash;100 range this page uses comes from the community
      table, whose two ends happen to match the client's exactly, which is the reason to
      believe the rest of it.<br>
      <b>Whether the heal is the heal.</b> The element is <code>MaxHeal</code> &mdash; a
      ceiling. The client never says whether the actual heal equals it, and never states its
      units.<br>
      <b>Abilities past the first.</b> Only the 70 Common pets declare a
      <code>FirstAbility</code>; every Rare and Divine pet declares none. A pet's real loadout
      is assigned server-side.
    </div></div>`;
}

function trackRow(it){
  // One row of the enchant planner: the item, one slot per enchantment it can hold, and a
  // Roll button. Shared by Track's drill-in and by Kit, which is why it takes the item and
  // reads the plan and the locks off S.
  const n = it.ench || 0;
  const plan = S.ench[it.id] || [], locks = S.lock[it.id] || [];
  const strip = n
    ? `<span class="eslots">` + Array.from({length:n}, (_,k)=>{
        const e = plan[k] && enchById[plan[k]];
        const t = (e ? esc(e.name) + " &mdash; click to change" : "empty &mdash; click to choose")
                + ". Right-click to hold it through a reroll.";
        return `<button class="eslot${e?" on":""}${locks[k]?" lock":""}" type="button"
          data-eslot="${esc(it.id)}|${k}" title="${t}">${
          e ? (e.sp!=null?ico(e.sp):esc(e.name.slice(0,2))) : "+"
        }${locks[k]?`<span class="lk">&#128274;</span>`:""}</button>`;
      }).join("") + `</span>`
    : `<span class="dim">no enchant slots</span>`;
  return `<tr>
    <td style="width:82px">${icoPair(it)}</td>
    <td class="nm" style="width:210px">${esc(it.name)} ${tierTag(it)}</td>
    <td>${strip}</td>
    <td style="width:74px">${n?`<button class="mini" type="button" data-roll="${esc(it.id)}"
      title="Draw every unheld slot again, weighted the way the game weights them">Roll</button>`:""}</td>
  </tr>`;
}

function trackView(){
  if(!S.track.length) return `<div class="empty">Nothing tracked yet.<br>
    Click an item in <b>Items</b> and the dungeon you need shows up here.</div>`;

  // Group what you are hunting by PLACE, then list the places by how hard they are.
  // The question this page answers is "what do I run tonight", so the dungeon is the
  // unit, not the item.
  const g={};
  S.track.forEach(id=>{ const it=byId[id]; if(!it) return;
    const s=it.sources[0]; const k=s?(s.name||("ORG_"+s.code)):"Not recorded";
    (g[k]=g[k]||[]).push(it); });

  if(S.trackAt && g[S.trackAt]) return trackDungeon(S.trackAt, g[S.trackAt]);
  S.trackAt=null;

  const keys=Object.keys(g).sort((a,b)=>{
    const da=(SRCI[a]||{}).diff, db=(SRCI[b]||{}).diff;
    // Anything with no difficulty - realm whites, events, ST sets - sits after the
    // dungeons rather than pretending to be difficulty 0.
    if(da==null && db==null) return a.localeCompare(b);
    if(da==null) return 1;
    if(db==null) return -1;
    return da-db;
  });

  const rows=keys.map(k=>{
    const e=SRCI[k]||{}, n=g[k].length;
    return `<button class="dgrow" type="button" data-trackat="${esc(k)}">
      <span class="art">${e.sp!=null?ico(e.sp):`<div class="ico none"></div>`}${
        e.boss!=null?ico(e.boss):""}</span>
      <span class="txt"><span class="nm">${esc(k)}</span>
        <span class="dim">${n} item${n==1?"":"s"} you want here</span></span>
      ${e.diff!=null?`<span class="diff" title="dungeon difficulty from the game files, 0-10">${e.diff}</span>`
                    :`<span class="diff none" title="not a dungeon — no difficulty rating">&mdash;</span>`}
      <span class="chev">&#8250;</span>
    </button>`;}).join("");

  return `<div class="hint">The dungeons you need, easiest first. Click one to see what you
    are hunting there.</div><div class="scroll"><div class="dglist">${rows}</div></div>`;
}

function trackDungeon(key, list){
  const e=SRCI[key]||{};
  const bio=BIOME_OF[key];
  return `<div class="hint"><button class="mini" data-trackback>&#8249; all dungeons</button></div>
    <div class="dghead">
      <span class="art">${e.sp!=null?ico(e.sp):""}${e.boss!=null?ico(e.boss):""}</span>
      <div style="min-width:0"><div class="nm">${esc(key)}</div>
        <div class="dim">${list.length} tracked${e.diff!=null?` &middot; difficulty ${e.diff}`:""}</div></div>
      ${bio?`<button class="mini" data-biome="${esc(bio)}">show in bestiary</button>`:""}
    </div>
    <div class="scroll"><table class="items"><tbody>${
      list.map(trackRow).join("")}</tbody></table></div>`;
}

// The bands are drawn top-to-bottom in the infographic, so list them that way rather
// than alphabetically: the rail then reads in the same order as the picture beside it.
function biomeOrder(){
  return Object.keys(BIOME_BANDS).sort((a,b) => BIOME_BANDS[a].y0 - BIOME_BANDS[b].y0);
}

function bestiaryView(){
  const rows = biomeOrder().map(b => {
    const st = S.biomeMark[b] || "";
    return `<div class="brow ${st==="g"?"on":st==="r"?"off":""}">
      <button class="bmark g" type="button" data-bmark="g|${esc(b)}"
        aria-pressed="${st==="g"}" title="Hunting here — light it up">&#10003;</button>
      <button class="bmark r" type="button" data-bmark="r|${esc(b)}"
        aria-pressed="${st==="r"}" title="Done with it — darken it">&#10005;</button>
      <button class="bname" type="button" data-bgo="${esc(b)}"
        title="Jump to ${esc(b)}${BIOME_BANDS[b].exact===false?" — this band's top edge is inferred":""}">${
        esc(b)}${BIOME_BANDS[b].exact===false?`<span class="approx" title="the top edge of this band is inferred, not measured">~</span>`:""}</button>
    </div>`;
  }).join("");
  const marked = Object.values(S.biomeMark).filter(Boolean).length;
  return `<div class="hint">Realm bestiary &mdash; which mobs drop which biome whites, set pieces and
    biome events. <b>Community infographic by GHZD</b>, not game data, so it is not cross-checked
    against the client. Scroll to zoom, drag to pan.
    <button class="mini" data-bfit>fit</button><button class="mini" data-b100>100%</button>
    ${marked?`<button class="mini" data-bclear>clear ${marked} mark${marked===1?"":"s"}</button>`:""}</div>
    <div class="bestiary">
      <div class="brail">
        <div class="railhead">Biomes</div>
        ${rows||`<div class="dim" style="padding:8px 10px">No bands measured.</div>`}
      </div>
      <div class="bwrap" id="bwrap"><img id="bimg" alt="Realm bestiary" draggable="false">
        <div class="bshade" id="bshade"></div>
        <div class="bband" id="bband" hidden></div></div>
    </div>`;
}

function wireBestiary(){
  const wrap=$("#bwrap"), img=$("#bimg");
  if(!img.src){                                   // decode on first open, not on page load
    const src=(document.getElementById("bestiary-src")||{}).textContent||"";
    if(src.trim()) img.src=src.trim(); else wrap.innerHTML='<div class="empty">Bestiary image not bundled.</div>';
  }
  const band=$("#bband");
  let z=0.3,x=0,y=0,drag=null;
  const apply=()=>{ img.style.transform=`translate(${x}px,${y}px) scale(${z})`;
    // The highlight rides the same transform, so it stays glued to its band while panning.
    const b=BIOME_BANDS[S.biome];
    if(b && band){ band.hidden=false;
      band.style.transform=`translate(${x}px,${y+b.y0*z}px)`;
      band.style.width=(img.naturalWidth*z)+"px";
      band.style.height=((b.y1-b.y0)*z)+"px";
    } else if(band){ band.hidden=true; }
    drawShade(); };

  // Green = hunting here, red = done with it. A band is dimmed if it is red, or if
  // anything at all is green and this one is not - so marking one biome green fades the
  // whole rest of the sheet, which is the point of marking it.
  const shade=$("#bshade");
  function drawShade(){
    if(!shade || !img.naturalWidth) return;
    const anyGreen=Object.values(S.biomeMark).some(v=>v==="g");
    const parts=biomeOrder().filter(n2=>{
      const m2=S.biomeMark[n2];
      return m2==="r" || (anyGreen && m2!=="g");
    }).map(n2=>{
      const bb=BIOME_BANDS[n2];
      // A band you marked red is darker than one that is merely not-green, or "done
      // with it" and "not chosen yet" would look identical.
      return `<div class="bdim${S.biomeMark[n2]==="r"?" red":""}"
        style="transform:translate(${x}px,${y+bb.y0*z}px);
        width:${img.naturalWidth*z}px;height:${(bb.y1-bb.y0)*z}px"></div>`;
    });
    const lit=biomeOrder().filter(n2=>S.biomeMark[n2]==="g").map(n2=>{
      const bb=BIOME_BANDS[n2];
      return `<div class="blit" style="transform:translate(${x}px,${y+bb.y0*z}px);
        width:${img.naturalWidth*z}px;height:${(bb.y1-bb.y0)*z}px"></div>`;
    });
    shade.innerHTML=parts.join("")+lit.join("");
  }
  const fit=()=>{ if(!img.naturalWidth) return;
    z=Math.min(wrap.clientWidth/img.naturalWidth, wrap.clientHeight/img.naturalHeight);
    x=(wrap.clientWidth-img.naturalWidth*z)/2; y=0; apply(); };
  // Jumping to a biome: fill the width, then put that band's top near the top of the view.
  const goto_=(name)=>{ const b=BIOME_BANDS[name]; if(!b||!img.naturalWidth) return;
    S.biome=name;
    z=Math.min(6, wrap.clientWidth/img.naturalWidth);
    x=(wrap.clientWidth-img.naturalWidth*z)/2;
    y=Math.min(0, -(b.y0*z) + 12);
    apply(); };
  img.addEventListener("load",()=>{ if(S.biome && BIOME_BANDS[S.biome]) goto_(S.biome); else fit(); });
  if(img.complete){ if(S.biome && BIOME_BANDS[S.biome]) goto_(S.biome); else fit(); }
  wrap.addEventListener("wheel", e=>{ e.preventDefault();
    const f=e.deltaY<0?1.15:1/1.15, nz=Math.min(6,Math.max(0.03,z*f));
    const r=wrap.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    x=mx-(mx-x)*(nz/z); y=my-(my-y)*(nz/z); z=nz; apply(); }, {passive:false});
  wrap.addEventListener("pointerdown", e=>{ e.preventDefault(); drag={sx:e.clientX-x,sy:e.clientY-y};
    try{ wrap.setPointerCapture(e.pointerId); }catch(_){} });
  wrap.addEventListener("pointermove", e=>{ if(!drag) return; x=e.clientX-drag.sx; y=e.clientY-drag.sy; apply(); });
  wrap.addEventListener("pointerup", ()=>{ drag=null; });
  wrap.addEventListener("pointercancel", ()=>{ drag=null; });
  const bar=wrap.parentNode;
  bar.addEventListener("click", e=>{
    if(e.target.closest("[data-bclear]")){ S.biomeMark={}; LSet("rm.biomeMark",{}); render(); return; }
    if(e.target.closest("[data-bfit]")){ S.biome=null; fit(); }
    else if(e.target.closest("[data-b100]")){ z=1; x=0; y=0; apply(); } });
  const rail=$(".brail");
  if(rail) rail.addEventListener("click", e=>{
    const go=e.target.closest("[data-bgo]");
    if(go){ goto_(go.dataset.bgo); return; }
    const mk=e.target.closest("[data-bmark]");
    if(!mk) return;
    const [want,name]=mk.dataset.bmark.split("|");
    // Clicking the mark it already has clears it, so a biome can go back to neutral
    // without a third button to explain.
    if(S.biomeMark[name]===want) delete S.biomeMark[name]; else S.biomeMark[name]=want;
    LSet("rm.biomeMark", S.biomeMark);
    // Repaint the rail in place: re-rendering the view would reload the 2 MB image and
    // throw away the pan and zoom.
    const row=mk.closest(".brow");
    row.className="brow "+(S.biomeMark[name]==="g"?"on":S.biomeMark[name]==="r"?"off":"");
    row.querySelectorAll("[data-bmark]").forEach(bt=>
      bt.setAttribute("aria-pressed", String(S.biomeMark[name]===bt.dataset.bmark.split("|")[0])));
    drawShade();
  });
}

// Grouping that matches how people actually think about enchants, built from the
// EnchantmentLabels the client already ships.
// Enchantment categories, as a player thinks about them rather than as the client files
// them. Two rules make this work:
//   * A stat tab already contains the dual-stat, trade-off and stat-proc versions - the
//     client puts the ATTACK label on "Attack -Defense Tradeoff" too. So DUALSTAT and
//     TRADEOFF are not categories; they are cross-cuts, and having tabs for them just
//     split the same enchantments across two places.
//   * A category is a SET of labels, not one label. "Weapon" is damage, fire rate and
//     range together, because that is the question ("what do I want on this bow").
// Anything none of them claim lands in Misc - 64 enchantments, mostly named uniques.
const ECATS = [
  ["all",      "All",        null],
  ["ATTACK",   "Attack",     ["ATTACK"]],
  ["DEFENSE",  "Defense",    ["DEFENSE"]],
  ["DEXTERITY","Dexterity",  ["DEXTERITY"]],
  ["WISDOM",   "Wisdom",     ["WISDOM"]],
  ["VITALITY", "Vitality",   ["VITALITY"]],
  ["LIFE",     "Life",       ["LIFE"]],
  ["MANA",     "Mana",       ["MANA"]],
  ["SPEED",    "Speed",      ["SPEED"]],
  ["WEAPON",   "Weapon",     ["WEAPONDAMAGE","WEAPONFIRERATE","WEAPONRANGE","DAMAGE",
                              "PROJSPEED","LIFETIME"]],
  ["PROC",     "Proc",       ["PROC","ONHIT","ONSHOOT","ONABILITY","BULLETCREATE"]],
  ["RECOVERY", "Recovery",   ["RECOVERY","FLATREGEN","LIFEREGEN","MANAREGEN",
                              "PERCENTAGEREGEN","HEAL","HEALING","MPCOSTREDUCTION"]],
  ["BONUS",    "XP / dust / loot", ["XP","DUST","LOOT","REWARD","REWARDBONUS",
                              "DUALREWARDBONUS"]],
  ["misc",     "Misc",       []],
];
// Everything a real category claims, so Misc can be "none of the above" rather than a
// hand-kept list that drifts the moment the client adds a label.
const ECAT_CLAIMED = new Set(ECATS.flatMap(([,,ls]) => ls || []));
function enchInCat(e, cat){
  if(cat === "all") return true;
  if(cat === "misc") return !e.labels.some(l => ECAT_CLAIMED.has(l));
  const ls = (ECATS.find(c => c[0] === cat) || [])[2] || [];
  return e.labels.some(l => ls.includes(l));
}

// What may legally roll on a given item: label intersection minus both exclusion lists.
// Which enchantments can legally sit on an item, and beside which others.
//
// CompatibleWithItemLabels is AND, not intersection: the item must carry EVERY token.
// Reading it as "shares any label" made PATH_OF_THE_MAGUS_STAFF legal on 1,473 items
// instead of the 1 it is designed for, and inflated every "can roll here" count.
//
// IncompatibleWithItemLabels is OR - any single match excludes. Proof that the two
// differ: 60 enchantments declare "ABILITY,WEAPON" there, and NO item carries both,
// so under AND those declarations would do nothing at all.
// ---------------------------------------------------------------------------
// Themes. Each is nothing but a set of the same tokens the stylesheet already uses,
// so switching one cannot break layout. The two brand palettes are the real values
// from TerraByte-Dev/TerraPlayer and TerraByte-Dev/OpenEdu, not approximations.
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Themes.
//
// Twelve of these are TerraPlayer's palettes, ported. TerraPlayer only overrides four
// tokens per theme - accent, a second accent, ink, and a deep accent - and lets black
// backgrounds and alpha-derived greys do the rest. This app's token set is wider, so
// mkTheme() derives the rest from those four the same way TerraPlayer's stylesheet does:
// panels and rules are the accent at low alpha over black, dim and faint ink are the ink
// colour at 55% and 32%.
//
// --good and --warn are deliberately NOT themed. They are semantic - green means a stat
// went up, red means it went down - and recolouring them per theme would make a Crimson
// user read every buff as a warning.
// ---------------------------------------------------------------------------
const hex2rgb = h => {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(",");
};
function mkTheme(name, accent, ink, deep, font){
  const a = hex2rgb(accent), i = hex2rgb(ink);
  return { name, swatch: accent, v: {
    "--bg": "#000000",
    "--bg-panel": `rgba(${a},.035)`,
    "--bg-hover": `rgba(${a},.09)`,
    "--line": `rgba(${a},.20)`,
    "--line-soft": `rgba(${a},.09)`,
    "--ink": ink,
    "--ink-dim": `rgba(${i},.58)`,
    "--ink-faint": `rgba(${i},.34)`,
    "--accent": accent,
    "--accent-dim": deep,
    "--accent-glow": `rgba(${a},.15)`,
    ...(font ? { "--font": font } : {}),
  } };
}
const PLEX = "'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace";

const THEMES = {
  // The two Tate picked out, kept exactly as they were.
  roadmap: { name:"Roadmap", swatch:"#4ee39a", v:{} },   // {} = the stylesheet defaults
  slate: { name:"Slate", swatch:"#4493f8", v:{
    "--bg":"#0d1117", "--bg-panel":"#11161d", "--bg-hover":"#161b22",
    "--line":"#2a313a", "--line-soft":"#20262d",
    "--ink":"#c9d1d9", "--ink-dim":"#8b949e", "--ink-faint":"#6e7681",
    "--accent":"#4493f8", "--accent-dim":"#1f4b7a", "--accent-glow":"rgba(68,147,248,.16)",
    "--warn":"#d29922", "--good":"#3fb950",
    "--font":"ui-monospace, SFMono-Regular, Consolas, monospace" } },

  // ---- ported from TerraPlayer, in its own order round the colour wheel ----
  mainframe:   mkTheme("Mainframe",   "#00FF88", "#9bf5b8", "#1f5e3a", PLEX),
  matrix:      mkTheme("Matrix",      "#39FF14", "#9DFF8F", "#1f6e22", PLEX),

  tangerine:   mkTheme("Tangerine",   "#FF7A18", "#FFD2A8", "#7a3a08", PLEX),

// The pixel font rides on <html> rather than on the theme, because it is orthogonal:
// any of the 15 palettes can have it on or off.
function applyPixel(on){
  S.pixel = !!on;

  LSet("rm.pixel", S.pixel);

function applyTheme(id){
  const th = THEMES[id] || THEMES.roadmap;
  const r = document.documentElement;
  // Clear whatever the last theme set before applying the next, or tokens a theme does
  // not define would linger from the previous one.
  Object.values(THEMES).forEach(t2 => Object.keys(t2.v).forEach(k => r.style.removeProperty(k)));
  Object.entries(th.v).forEach(([k,v]) => r.style.setProperty(k,v));
  S.theme = id; LSet("rm.theme", id);
}

function legalFor(item, placed){
  const L = new Set(item.labels || []);
  const others = (placed || []).filter(Boolean);
  return D.enchants.filter(e => {
    if (!(e.labels || []).includes("ROLLABLE")) return false;
    if ((e.compat || []).length && !e.compat.every(c => L.has(c))) return false;   // AND
    if ((e.noItem || []).some(c => L.has(c))) return false;                        // OR
    if ((e.noIds || []).includes(item.id)) return false;
    // Enchantments also exclude EACH OTHER across slots on the same item. 1,553 pairs
    // conflict in only one direction, which would make legality depend on roll order,
    // so the check is deliberately symmetric.
    for (const o of others){
      if (o.id === e.id) return false;
      if ((e.excl || []).some(x => (o.labels || []).includes(x))) return false;
      if ((o.excl || []).some(x => (e.labels || []).includes(x))) return false;
    }
    return true;
  });
}

// A weighted draw over the legal pool, using the client's own <Weight> values.
function rollEnchant(item, placed){
  const pool = legalFor(item, placed);
  let total = 0;
  for (const e of pool) total += (+e.weight || 0);
  if (!pool.length || total <= 0) return null;
  let x = Math.random() * total;
  for (const e of pool){ x -= (+e.weight || 0); if (x <= 0) return e; }
  return pool[pool.length - 1];
}
function kitItems(){
  return (S.kit[S.cls] || []).map(id => id && byId[id]).filter(Boolean);
}

// Enchantment LEVEL, I to IV. Not a rarity - the client ships four objects per
// enchantment and the tier label is which of the four you rolled, so "Divine" and
// "Legendary" were the wrong words for it. Colour still climbs with the level, because
// that reads faster than the numeral, but the label is the numeral.
// The dots are DRAWN, not extracted: there is no pip art in the sprite sheets.
const TIERS = {1:["I","#4ee39a"], 2:["II","#4ec8e3"],
               3:["III","#b46ce8"], 4:["IV","#ffcf4a"]};
// ---------------------------------------------------------------------------
// Stat chips.
//
// A row of "+6.6 VIT / -3 ATT" reads at a glance in a way an English sentence never
// will, which is the whole reason to prefer it over the enchantment's own description.
//
// The bottle is the game's own stat-potion sprite and the three-letter colour is taken
// from that bottle's own pixels, so nothing here is a palette somebody typed in: the
// client says which potion raises which stat, and the art says what colour it is.
// The sign is what turns green or red - a debuff on an otherwise good enchantment is
// the thing you actually need to spot.
// ---------------------------------------------------------------------------
const STATSP = (SP.stats) || {};
const STATCOL = (SP.statColors) || {};
// Three letters, so a column of them lines up. MAXHP/MAXMP are what the files call
// them; nobody says that out loud.
const STAT3 = { MAXHP: "LIF", MAXMP: "MAN", ATT: "ATT", DEF: "DEF", SPD: "SPD",
                DEX: "DEX", VIT: "VIT", WIS: "WIS" };

// Every stat an item touches, in four visually distinct kinds - because they are four
// different promises and treating them alike is how you buy the wrong item:
//   solid chip    permanent, and in your Kit totals
//   dashed chip   conditional: only while shooting, or for 5s after an ability
//   % chip        a percentage of another stat, not points
//   x chip        this item's effect scales off that stat
function condTitle(c){
  const bits = [c.on];
  if(c.dur) bits.push(`${c.dur}s`);
  if(c.cd) bits.push(`${c.cd}s cooldown`);
  // proc= is not defined in any of the 246 files. Its values run 0.01 to 1.0 and never
  // above 1, so it is shown as the raw number rather than called a percentage.
  if(c.proc!=null && c.proc<1) bits.push(`proc ${c.proc}`);
  if(c.ladder) bits.push(`per enemy: ${c.ladder.join(" / ")}`);
  return bits.join(" · ");
}
function itemChips(it){
  const flat = it.bonus ? Object.entries(it.bonus) : [];
  const cond = it.cond || [], scal = it.scal || [], scaled = it.scaled || [];
  if(!flat.length && !cond.length && !scal.length && !scaled.length && it.disc==null) return "";
  return `<span class="chips tight">${
    flat.map(([k,v]) => statChip(k, v)).join("")}${
    cond.map(c => statChip(c.stat, c.amt!=null?c.amt:(c.ladder?`${c.ladder[0]}–${c.ladder[c.ladder.length-1]}`:"?"),
                          null, {cond:true, title:condTitle(c)})).join("")}${
    scal.map(k => `<span class="chip scal" title="this item's effect scales off ${esc(k)}">${
      STATSP[k]!=null?ico(STATSP[k]):""}<b style="color:${STATCOL[k]||"var(--ink)"}">${
      STAT3[k]||k}</b><i class="x">scales</i></span>`).join("")}${
    scaled.length ? `<span class="chip" title="${esc(scaled.map(x=>
      `${x.stat} ${x.amt>0?"+":""}${x.amt}${x.of?` of ${x.of}`:""}`).join(" · "))}"><b
      style="color:var(--shiny)">%</b><i>${scaled.length}</i></span>` : ""}${
    it.disc!=null ? `<span class="chip" title="this item's ability costs ${
      Math.round(it.disc*100)}% of its usual MP"><b style="color:var(--shiny)">MP</b><i
      class="up">${Math.round((it.disc-1)*100)}%</i></span>` : ""}</span>`;
}

function statChip(stat, amt, of, opt){
  const key = String(stat || "").toUpperCase();
  // 41 enchantments move something that is not one of the eight stats - dust, XP, damage
  // resistance - and those rows used to render as an empty bordered box.
  if(!key) return "";
  const label = STAT3[key] || key.slice(0, 3);
  const col = STATCOL[key] || "var(--ink)";
  const n = +amt;
  const sign = isNaN(n) ? "" : (n > 0 ? "+" : "");
  const cls = isNaN(n) ? "" : (n > 0 ? "up" : n < 0 ? "down" : "");
  const o = opt || {};
  return `<span class="chip${o.cond?" cond":""}" title="${esc(key)}${
    of ? ` — scaled off ${esc(of)}` : ""}${o.title ? ` — ${esc(o.title)}` : ""}">${
    STATSP[key] != null ? ico(STATSP[key]) : ""
  }<b style="color:${col}">${label}</b><i class="${cls}">${sign}${esc(String(amt))}${
    of ? `<span class="of">% of ${esc(STAT3[of] || of)}</span>` : ""}</i></span>`;
}

// Every stat an enchantment moves, as chips. Flat and scaled are kept visually apart
// for the same reason the item detail keeps them apart: they cannot be added together.
function enchChips(e){
  if (!e.mut || !e.mut.length) return "";
  return `<div class="chips">${e.mut.map(m =>
    statChip(m.stat, m.amt != null ? m.amt : m.mult, m.of)).join("")}</div>`;
}

// The multiplier half - "Damage x1.05" - which is not a stat and gets its own shape.
const MXLABEL = { dmgMin: "min dmg", dmgMax: "max dmg", rof: "fire rate",
                  speed: "proj speed", life: "proj range", size: "proj size", mp: "MP cost" };
function enchMultChips(e){
  if (!e.mx) return "";
  const rows = Object.entries(e.mx).filter(([k]) => k !== "only");
  if (!rows.length) return "";
  return `<div class="chips">${rows.map(([k, v]) => {
    const up = v > 1;
    return `<span class="chip"><b>${MXLABEL[k] || k}</b><i class="${up ? "up" : "down"}">${
      up ? "+" : ""}${Math.round((v - 1) * 1000) / 10}%</i></span>`;
  }).join("")}</div>`;
}

// ---------------------------------------------------------------------------
// Damage, with the enchantments you have planned.
//
// The <Mutators> block of an enchantment carries the multiplier the description only
// states in English: "Increases Weapon Damage by 5%" ships as MultiplyMinDamage 1.05.
// 55 enchantments carry one, they all apply to every projectile (projectileId="-1"),
// and they multiply, so the whole calculation here is exact arithmetic on numbers the
// client states outright.
//
// What is NOT here, and cannot be: the client contains no formula relating your Attack
// or Dexterity to damage, and no defense model. So the absolute DPS below is the same
// pre-stat number the Items table ranks on. The PERCENTAGES are unaffected by that -
// a missing constant factor cancels out of a ratio - so "+10% with these enchants" is
// exactly right even though "123 DPS" is a comparison number rather than a game number.
// ---------------------------------------------------------------------------

// Enchantments planned for an item, as objects, in slot order.
function planned(it){
  return (S.ench[it.id] || []).map(id => id && enchById[id]).filter(Boolean);
}

function weaponMath(it, ench){
  const m = { dmgMin:1, dmgMax:1, rof:1, speed:1, life:1, size:1, mp:1 };
  (ench || []).forEach(e => Object.entries(e.mx || {}).forEach(([k, v]) => {
    if (k !== "only" && k in m) m[k] *= v;
  }));
  const dmg = it.dmg || null;
  // The damage multipliers hit every projectile, so their effect on DPS is a plain ratio
  // on the average - which lets this scale it.rel rather than re-deriving it. That matters
  // for the multi-mode weapons, whose rel sums several sub-attacks with different rates.
  const avgMult = dmg && (dmg[0] + dmg[1])
    ? (dmg[0]*m.dmgMin + dmg[1]*m.dmgMax) / (dmg[0] + dmg[1])
    : m.dmgMax;
  return {
    m,
    dmg,
    newDmg: dmg ? [dmg[0]*m.dmgMin, dmg[1]*m.dmgMax] : null,
    rof: it.rof, newRof: it.rof != null ? it.rof * m.rof : null,
    rel: it.rel, newRel: it.rel != null ? it.rel * avgMult * m.rof : null,
    dpsMult: avgMult * m.rof,
    // Range is speed x lifetime: the projectile's own distance is one times the other.
    rangeMult: m.speed * m.life,
    mpMult: m.mp,
    sizeMult: m.size,
  };
}

const pct = x => `${x >= 1 ? "+" : ""}${Math.round((x - 1) * 1000) / 10}%`;
// Rate of fire lives around 0.3; one decimal place turned 0.33 into 0.3 and made a 5%
// enchantment look like it did nothing at all.
const n1 = x => Math.round(x * (Math.abs(x) < 10 ? 100 : 10)) / (Math.abs(x) < 10 ? 100 : 10);

function damagePanel(it){
  if (!it || !WEAPON_SLOT_SET.has(it.slot)) return "";
  const ench = planned(it);
  const w = weaponMath(it, ench);
  const changed = ench.some(e => e.mx);
  const col = (label, base, after, mult) =>
    `<tr><td class="k">${label}</td><td class="num">${base}</td>` +
    (changed ? `<td class="num hi">${after}</td>
      <td class="num ${mult > 1 ? "up" : mult < 1 ? "down" : "dim"}">${
        mult === 1 ? "&mdash;" : pct(mult)}</td>` : "") + `</tr>`;

  const rows = [
    w.dmg ? col("Damage per shot", `${n1(w.dmg[0])}–${n1(w.dmg[1])}`,
                `${n1(w.newDmg[0])}–${n1(w.newDmg[1])}`,
                (w.m.dmgMin + w.m.dmgMax) / 2) : "",
    it.shots != null ? col("Shots", it.shots, it.shots, 1) : "",
    it.rof != null ? col("Rate of fire", `${n1(it.rof)}×`, `${n1(w.newRof)}×`, w.m.rof) : "",
    it.rel != null ? col("<b>DPS*</b>", Math.round(it.rel), Math.round(w.newRel), w.dpsMult) : "",
    w.rangeMult !== 1 ? col("Range", "1×", `${n1(w.rangeMult)}×`, w.rangeMult) : "",
    it.mp != null && w.mpMult !== 1 ? col("MP cost", it.mp, n1(it.mp * w.mpMult), w.mpMult) : "",
  ].filter(Boolean).join("");

  const head = changed
    ? `<thead><tr><th></th><th class="num">base</th>
        <th class="num">with your ${ench.filter(e=>e.mx).length === 1 ? "enchant" : "enchants"}</th>
        <th class="num"></th></tr></thead>` : "";

  const which = ench.filter(e => e.mx).map(e => esc(e.name)).join(" · ");

  return `<div class="dsec">Damage</div>
    <table class="dmg">${head}<tbody>${rows}</tbody></table>
    ${which ? `<div class="dim" style="margin-top:5px">Applying: ${which}</div>` : ""}
    ${!changed && it.ench ? `<div class="dim" style="margin-top:5px">Plan enchantments for this
      item in <b>Kit</b> and this table gains a second column.</div>` : ""}
    <div class="dim" style="margin-top:6px;line-height:1.5">* The client carries no formula
      relating your <b>Attack</b> or <b>Dexterity</b> to damage, and no defense model, so the
      absolute number is a comparison figure rather than what the game will show you. The
      <b>percentages are exact</b> either way &mdash; the missing factor cancels out of a
      ratio.</div>`;
}

function tierDots(t, top){
  const n = +String(t).replace("TIER","");
  const v = TIERS[n];
  if(!v) return `<div class="tier"><span class="dim">one level only</span></div>`;
  return `<div class="tier" title="Level ${v[0]} of IV${top?" — the best roll of this enchantment":""}">` +
    `<span class="pips">` +
    Array.from({length:n},()=>`<i style="background:${v[1]}"></i>`).join("") +
    `</span><span style="color:${v[1]}">${v[0]}</span>${
      top?`<span class="best">BEST</span>`:""}</div>`;
}

function drawEnch(){
  const cats=$("#ecats");
  if(cats && !cats.dataset.built){
    cats.dataset.built="1";
    cats.innerHTML = ECATS.map(([k,l])=>`<button class="tab" type="button" data-ecat="${k}"
        aria-selected="${(S.ecat||"all")===k}">${l}</button>`).join("");
  }
  const q=($("#q").value||"").trim().toLowerCase();
  const cat=S.ecat||"all";
  const fit=$("#fitkit") && $("#fitkit").checked;
  const topOnly=$("#enchtop") && $("#enchtop").checked;
  const equipped=kitItems();

  // Picking a slot for a tracked item narrows the 1,016 enchantments to the ones that
  // can legally roll on THAT item - which is the only version of this list that helps.
  const pick = S.enchPick && byId[S.enchPick.id] ? byId[S.enchPick.id] : null;
  let pool=D.enchants;
  let legalIds=null;
  if(pick){
    const others=(S.ench[pick.id]||[]).map((id,k)=> k===S.enchPick.slot?null:(id&&enchById[id]));
    const ok=new Set(legalFor(pick, others).map(e=>e.id));
    pool=pool.filter(e=>ok.has(e.id));
  }
  if(fit && equipped.length){
    legalIds=new Set();
    equipped.forEach(it => legalFor(it).forEach(e => legalIds.add(e.id)));
    pool=pool.filter(e=>legalIds.has(e.id));
  }
  // Only ever hides rows. legalFor() and the roller still see all four levels, because
  // the game rolls all four - this is about what is worth reading, not what can happen.
  if(topOnly) pool=pool.filter(e=>e.top);
  if(cat!=="all") pool=pool.filter(e=>enchInCat(e,cat));
  if(q) pool=pool.filter(e=>(e.name+" "+e.desc+" "+e.labels.join(" ")).toLowerCase().includes(q));

  $("#count").textContent=`${pool.length} of ${D.counts.enchants}`+
      (fit?(equipped.length?" · legal on your kit":" · equip something in Kit first"):"");

  const planner = fit && equipped.length ? `<div class="plan">${equipped.map(it=>{
      const n=legalFor(it).length;
      return `<div class="planrow">${ico(it.sp)}<div><div class="nm">${esc(it.name)}</div>
        <div class="dim">${it.ench!=null?it.ench+" slot"+(it.ench==1?"":"s"):"slots unknown"} ·
        ${n} enchantments can roll here</div></div></div>`;}).join("")}</div>` : "";

  const pickBar = pick ? `<div class="picking">Choosing enchantment
      <b>slot ${S.enchPick.slot+1}</b> for <b>${esc(pick.name)}</b> &mdash;
      ${pool.length} can legally roll here.
      <a href="#" data-eclear style="color:inherit">clear this slot</a> &middot;
      <a href="#" data-ecancel style="color:inherit">cancel</a></div>` : "";

  $("#list").innerHTML = pickBar + planner + `<div class="egrid">${pool.slice(0,500).map(e=>`
    <div class="ecard" data-ench="${esc(e.id)}" ${pick?'style="cursor:pointer"':""}>
      <div class="ehead">${e.sp!=null?ico(e.sp):""}<div>
        <div class="nm">${esc(e.name)}</div>
        ${tierDots(e.tier, e.top && !topOnly)}</div></div>
      ${enchChips(e)}${enchMultChips(e)}
      ${(e.mut&&e.mut.length)||e.mx?"":`<div class="dim edesc">${esc(e.desc)}</div>`}
      ${e.excl.length?`<div class="eexcl">cannot share a slot with: ${esc(e.excl.join(", "))}</div>`:""}
    </div>`).join("")}</div>
    ${pool.length>500?`<div class="empty">Showing 500 of ${pool.length}. Narrow it down.</div>`:""}
    ${pool.length===0?`<div class="empty">Nothing matches.</div>`:""}`;
}

// ---------------------------------------------------------------------------
// Overlay widget. The Rust side opens a second window on index.html#widget; the
// page notices the hash and renders this instead of the whole app, so there is
// only ever one frontend.
//
// The unit here is the PLACE, not the item. The question the overlay answers while
// you are playing is "what am I running next", so the dungeon is what you see -
// big, all of them at once - and the items you want there are one click away.
// ---------------------------------------------------------------------------

// Largest first. fitWidget() walks down this until the collapsed list stops
// overflowing, so a short list gets big art and a long one still fits the window.
// It stops at 26px: past that the icon is no longer something you can recognise
// across a room, which is the entire point of the overlay, so a very long list
// scrolls at a readable size instead of fitting at an unreadable one.
const WICO = [72, 60, 50, 42, 36, 30, 26];
let wOpen = null;        // the one place expanded, or null. One at a time stays readable.
let wWired = false;      // storage/resize listeners are global; bind them exactly once

function widgetGroups(){
  const g = {};
  S.track.forEach(id => { const it = byId[id]; if(!it) return;
    const s = it.sources[0];
    const k = s ? (s.name || ("ORG_" + s.code)) : "Not recorded";
    (g[k] = g[k] || []).push(it); });
  // Same order as the Track page: easiest first, and anything with no difficulty at all
  // - realm whites, events, ST sets - after the dungeons rather than pretending to be 0.
  const keys = Object.keys(g).sort((a,b) => {
    const da = (SRCI[a]||{}).diff, db = (SRCI[b]||{}).diff;
    if(da == null && db == null) return a.localeCompare(b);
    if(da == null) return 1;
    if(db == null) return -1;
    return da - db;
  });
  return { g, keys };
}

function fitWidget(){
  const list = document.getElementById("wlist");
  if(!list) return;
  // Measure the COLLAPSED list. Sizing to fit an expanded one would shrink every icon
  // to nothing the moment you opened a dungeon with a lot in it.
  // Measure the doors alone. Sizing to fit an expanded panel too would shrink every
  // icon to nothing the moment you opened a place with a lot in it.
  const drops = [...list.querySelectorAll(".drops")].map(d => [d, d.hidden]);
  drops.forEach(([d]) => { d.hidden = true; });
  for(const px of WICO){
    list.style.setProperty("--wico", px + "px");
    if(list.scrollHeight <= list.clientHeight) break;
  }
  drops.forEach(([d, was]) => { d.hidden = was; });
}

function renderWidget(){
  document.body.className = "widget";
  const { g, keys } = widgetGroups();
  const body = S.track.length
    ? keys.map(k => {
        const e = SRCI[k] || {}, n = g[k].length, open = wOpen === k;
        // The dungeon's own door, and nothing else. The boss portrait beside it made
        // two small pictures where one big one reads better across a room.
        const art = e.sp != null ? ico(e.sp)
                  : e.boss != null ? ico(e.boss)
                  : `<div class="ico none"></div>`;
        return `<button class="dg" type="button" data-wdg="${esc(k)}"
            aria-expanded="${open}" title="${esc(k)}${e.diff!=null?` — difficulty ${e.diff}`:""}">
            ${art}<span class="nm">${esc(k)}</span>${n>1?`<span class="n">${n}</span>`:""}</button>`;
      }).join("")
    : `<div class="empty">Nothing tracked.<br>Click items in the main window and they show up here.</div>`;

  const places = keys.length;
  // The expanded list sits under the whole grid, not inside it: an inline panel would
  // break the wrap and shove every later door onto a new line.
  const cur = wOpen && g[wOpen];
  const open = cur
    ? `<div class="drops"><div class="dtitle">${esc(wOpen)}</div>${cur.map(i =>
        `<div class="row">${ico(i.sp)}<span class="n">${esc(i.name)}</span></div>`).join("")}</div>`
    : "";
  document.body.innerHTML = `<div class="wdg">
    <div class="bar" data-tauri-drag-region>
      <span class="t" data-tauri-drag-region>${places} place${places===1?"":"s"} &middot;
        ${S.track.length} item${S.track.length===1?"":"s"}</span>
      <button id="wdg-x" type="button" title="Close overlay">&#10005;</button>
    </div>
    <div class="list" id="wlist"><div class="dgs">${body}</div>${open}</div>
  </div>`;

  document.getElementById("wdg-x").onclick = () => {
    if(globalThis.__TAURI__) __TAURI__.window.getCurrentWindow().close();
  };
  const list = document.getElementById("wlist");
  list.addEventListener("click", e => {
    const b = e.target.closest("[data-wdg]");
    if(!b) return;
    wOpen = wOpen === b.dataset.wdg ? null : b.dataset.wdg;
    renderWidget();
  });
  fitWidget();

  if(!wWired){
    wWired = true;
    // The main window owns the tracked list; pick up its edits without a refresh.
    // Bound once - re-binding inside renderWidget added a listener per render, so by
    // the tenth click one storage event fired ten re-renders.
    addEventListener("storage", ev => {
      if(ev.key === "rm.track"){ S.track = LS("rm.track") || []; renderWidget(); }
    });
    // The overlay is resizable, and the whole point is that it all fits.
    addEventListener("resize", fitWidget);
  }
}

function render(){
  renderRail(); renderViews();
  const p=$("#panel");
  // A view that throws used to leave the PREVIOUS view's markup on screen with the new
  // one selected in the rail - which reads as "the button does nothing" and is how a
  // missing function shipped unnoticed. Say so instead.
  try{ draw(p); }
  catch(err){
    console.error("view failed:", S.view, err);
    p.innerHTML = `<div class="empty">The <b>${esc(S.view)}</b> view failed to draw.<br>
      <code>${esc(String(err))}</code></div>`;
  }
}
function draw(p){
  if(S.view==="home"){ p.innerHTML=homeView(); }
  else if(S.view==="items"){ p.innerHTML=itemsView(); drawItems(); }
  else if(S.view==="kit"){ p.innerHTML=kitView(); }
  else if(S.view==="dungeons"){ p.innerHTML=dungeonsView(); }
  else if(S.view==="pets"){ p.innerHTML=petsView(); drawPets(); }
  else if(S.view==="track"){ p.innerHTML=trackView(); }
  else if(S.view==="bestiary"){ p.innerHTML=bestiaryView(); wireBestiary(); }
  else { p.innerHTML=enchView(); drawEnch(); }
}

document.addEventListener("change", e=>{
  if(e.target.id==="srcf"||e.target.id==="statf"){
    if(e.target.id==="statf"){ S.statf=e.target.value; LSet("rm.statf",S.statf); }
    drawItems(); }
});
document.addEventListener("input", e=>{
  if(e.target.id==="lvl1"){ S.lvl1=e.target.checked; render(); return; }
  if(e.target.id==="fitkit"){ drawEnch(); return; }
  if(e.target.id==="enchtop"){ S.enchTop=e.target.checked; LSet("rm.enchTop",S.enchTop); drawEnch(); return; }
  if(e.target.id==="petlv"){ S.petLv=+e.target.value; LSet("rm.petLv",S.petLv); drawPets();
    const b2=e.target.closest(".bar"); if(b2) b2.querySelector("b").textContent=S.petLv; return; }
  if(e.target.id==="petslot"){ S.petSlot=e.target.value; LSet("rm.petSlot",S.petSlot); drawPets(); return; }
  if(e.target.id==="petfrom"){ S.petFrom=+e.target.value; drawPets(); return; }
  if(e.target.id==="petto"){ S.petTo=+e.target.value; drawPets(); return; }
  if(e.target.id==="pixelfont"){ applyPixel(e.target.checked); return; }
  if(e.target.id==="petgear"){ S.petGear=e.target.checked; LSet("rm.petGear",S.petGear); drawPets(); return; }
  if(["q","tier","srcf","statf","hidere","showgone"].includes(e.target.id)){
    if(S.view==="items") drawItems();
    else if(S.view==="pets") drawPets();
    else if(S.view==="ench") drawEnch(); }
});
// Right-click a slot to hold it through a reroll. The game files contain no lock or
// reroll mechanic at all, so this is the app's affordance, not a game rule.
document.addEventListener("contextmenu", e=>{
  const es=e.target.closest("[data-eslot]");
  if(!es) return;
  e.preventDefault();
  const [id,slot]=es.dataset.eslot.split("|");
  const a=S.lock[id]||[]; a[+slot]=!a[+slot]; S.lock[id]=a;
  LSet("rm.lock",S.lock); render();
});

document.addEventListener("click", e=>{
  // --- window chrome ------------------------------------------------------
  const T2 = globalThis.__TAURI__;
  if(e.target.closest("#tb-pop") && T2){
    T2.core.invoke("open_widget",{alpha:S.opacity}).catch(()=>{}); return; }
  if(e.target.closest("#tb-gear")){ $("#sheet")?closeSettings():openSettings(); return; }
  if(e.target.closest("#tb-min") && T2){ T2.window.getCurrentWindow().minimize(); return; }
  if(e.target.closest("#tb-max") && T2){ T2.window.getCurrentWindow().toggleMaximize(); return; }
  if(e.target.closest("#tb-close") && T2){ T2.window.getCurrentWindow().close(); return; }
  const th=e.target.closest("[data-theme]");
  if(th){ applyTheme(th.dataset.theme);
    document.querySelectorAll("[data-theme]").forEach(b=>
      b.setAttribute("aria-pressed", String(b.dataset.theme===S.theme)));
    return; }
  if(e.target.closest("[data-closesheet]")){ closeSettings(); return; }
  if(e.target.closest("[data-widget]")){
    if(T2) T2.core.invoke("open_widget",{alpha:S.opacity}).catch(err=>{
      const m=$("#updmsg"); if(m) m.textContent="Could not open the overlay: "+String(err).slice(0,90); });
    return; }
  if(e.target.closest("[data-checkupd]")){
    const m=$("#updmsg"); if(!m) return;
    if(!T2 || !T2.updater){ m.textContent="Updates only apply to the installed desktop app."; return; }
    m.textContent="Checking…";
    T2.updater.check().then(up=>{
      if(!up){ m.textContent="You are on the latest version."; return; }
      m.innerHTML = `Version <b>${esc(up.version)}</b> is available. `+
        `<button class="sbtn" data-doupd>install &amp; restart</button>`;
    }).catch(err=> m.textContent="Update check failed: "+String(err).slice(0,110));
    return; }
  if(e.target.closest("[data-doupd]")){
    const m=$("#updmsg"); m.textContent="Downloading…";
    T2.updater.check().then(up=>up&&up.downloadAndInstall())
      .catch(err=> m.textContent="Update failed: "+String(err).slice(0,110));
    return; }
  // clicking the dimmed backdrop closes the sheet; clicking the card does not
  if(e.target.id==="sheet"){ closeSettings(); return; }
  if(e.target.closest("[data-cancelpick]")){ e.preventDefault(); S.kitPick=null; render(); return; }
  const star=e.target.closest("[data-star]");
  if(star){ e.stopPropagation();
    const id=star.dataset.star, i=S.track.indexOf(id);
    if(i>=0) S.track.splice(i,1); else S.track.push(id);
    LSet("rm.track",S.track);
    // Mutate in place. Calling render() here wiped the search box, both filters and the
    // scroll position on every star - which is the core loop.
    const on=S.track.includes(id);
    star.classList.toggle("on",on); star.textContent=on?"★":"☆";
    const badge=[...document.querySelectorAll(".vtab")].find(b=>b.textContent.trim().startsWith("Track"));
    if(badge){ const n=badge.querySelector(".n"); if(n) n.textContent=S.track.length; }
    if(S.view==="track") render();
    return; }
  const rl=e.target.closest("[data-roll]");
  if(rl){ e.stopPropagation();
    const it=byId[rl.dataset.roll]; if(!it) return;
    const n=it.ench||0, locks=S.lock[it.id]||[], plan=(S.ench[it.id]||[]).slice();
    // Roll every slot that is not held, one at a time, each draw seeing what the
    // earlier ones put down - that is what makes the cross-slot exclusions bite.
    for(let k=0;k<n;k++){ if(locks[k]) continue; plan[k]=null; }
    for(let k=0;k<n;k++){
      if(locks[k] && plan[k]) continue;
      const placed=plan.map((id,j)=> j===k?null:(id&&enchById[id]));
      const got=rollEnchant(it, placed);
      plan[k]=got?got.id:null;
    }
    S.ench[it.id]=plan; LSet("rm.ench",S.ench); render(); return; }
  const es=e.target.closest("[data-eslot]");
  if(es){ e.stopPropagation();
    const [id,slot]=es.dataset.eslot.split("|");
    S.enchPick={id, slot:+slot}; S.enchFrom=S.view; S.view="ench"; render(); return; }
  if(e.target.closest("[data-ecancel]")){ e.preventDefault(); S.enchPick=null; S.view=S.enchFrom||"track"; render(); return; }
  if(e.target.closest("[data-eclear]")){ e.preventDefault();
    const {id,slot}=S.enchPick||{};
    if(id){ const a=S.ench[id]||[]; a[slot]=null; S.ench[id]=a; LSet("rm.ench",S.ench); }
    S.enchPick=null; S.view=S.enchFrom||"track"; render(); return; }
  const ecard=e.target.closest("[data-ench]");
  if(ecard && S.enchPick){
    const {id,slot}=S.enchPick;
    const a=S.ench[id]||[]; a[slot]=ecard.dataset.ench; S.ench[id]=a;
    LSet("rm.ench",S.ench); S.enchPick=null; S.view=S.enchFrom||"track"; render(); return; }
  const ta=e.target.closest("[data-trackat]");
  if(ta){ S.trackAt=ta.dataset.trackat; render(); return; }
  if(e.target.closest("[data-trackback]")){ S.trackAt=null; render(); return; }
  const bio=e.target.closest("[data-biome]");
  if(bio){ S.biome=bio.dataset.biome; S.view="bestiary"; render(); return; }
  const ec=e.target.closest("[data-ecat]");
  if(ec){ S.ecat=ec.dataset.ecat;
    document.querySelectorAll("[data-ecat]").forEach(b=>
      b.setAttribute("aria-selected", String(b.dataset.ecat===S.ecat)));
    drawEnch(); return; }
  const cl=e.target.closest("[data-cls]");
  if(cl){ S.cls=cl.dataset.cls; LSet("rm.cls",S.cls); S.sel=null;
          if(S.view==="home") S.view="items";      // picking a character gets on with it
          render(); return; }
  const nv=e.target.closest("[data-view]");
  if(nv){ S.view=nv.dataset.view; S.sel=null; S.trackAt=null; S.dgAt=null; render(); return; }
  if(e.target.closest("[data-home]")){ S.view="home"; S.sel=null; render(); return; }
  if(e.target.closest("[data-pop]")){
    if(T2) T2.core.invoke("open_widget",{alpha:S.opacity}).catch(()=>{});
    return; }
  const pt=e.target.closest("[data-ptab]");
  if(pt){ S.ptab=pt.dataset.ptab; LSet("rm.ptab",S.ptab); render(); return; }
  const tab=e.target.closest("[data-tab]");
  if(tab){ S.tab=+tab.dataset.tab; S.sel=null; render(); return; }
  const ks=e.target.closest("[data-kitslot]");
  if(ks){ S.kitPick=+ks.dataset.kitslot; S.tab=S.kitPick; S.view="items"; render(); return; }
  const dga=e.target.closest("[data-dgat]");
  if(dga){ S.dgAt=dga.dataset.dgat; render(); return; }
  if(e.target.closest("[data-dgback]")){ S.dgAt=null; render(); return; }
  const row=e.target.closest("tr[data-id]");
  if(row){
    // Equipping is a SINGLE click while a kit slot is armed. The old dblclick could never
    // fire: the first click rebuilt the table, so click two landed on a different node.
    if(S.kitPick!=null && S.view==="items"){
      const kit=S.kit[S.cls]||[null,null,null,null];
      kit[S.kitPick]=row.dataset.id; S.kit[S.cls]=kit; LSet("rm.kit",S.kit);
      S.kitPick=null; S.view="kit"; render(); return;
    }
    const id=row.dataset.id;
    S.sel=id;
    if(S.view==="items"){
      // One click does both jobs: track it and open its detail.
      const at=S.track.indexOf(id);
      if(at>=0) S.track.splice(at,1); else S.track.push(id);
      LSet("rm.track",S.track);
      row.classList.toggle("tracked", S.track.includes(id));
      document.querySelectorAll("tr[data-id]").forEach(r=>
        r.setAttribute("aria-selected", String(r.dataset.id===id)));
      const badge=[...document.querySelectorAll(".vtab")].find(b=>b.textContent.trim().startsWith("Track"));
      if(badge){ const n=badge.querySelector(".n"); if(n) n.textContent=S.track.length; }
      drawDetail();
    } else { render(); }
    return; }
});

// A rebuild can retire an item id; drop stale tracked ids so the badge cannot lie.
S.track = S.track.filter(id => byId[id]);
LSet("rm.track", S.track);
if (!D.classes.some(c => c.name === S.cls)) S.cls = D.classes[0].name;

// The app draws its own title bar, so the page has to know which it is. In a browser
// this class is never set and the title bar stays display:none.
if (globalThis.__TAURI__) document.body.classList.add("tauri");
applyTheme(S.theme);
applyPixel(S.pixel);
if (globalThis.__ROTMG_WIDGET__) renderWidget(); else render();
</script>
</body>
